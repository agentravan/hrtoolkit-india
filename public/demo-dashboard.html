  /* ---------------- month-on-month employee performance ---------------- */
  employeeMonthly() {
    const ids = Ctx.empIds(true), d = Ctx.deptFilter(), mi = Ctx.mIdx();
    const rows = DB.empMonthly.filter(x => ids.has(x.empId) && (!d || x.dept === d) && mi.has(x.mi)
      && (State.filters.site === 'All' || x.site === State.filters.site));
    const months = Ctx.months();
    const people = Object.entries(groupBy(rows, x => x.empId)).map(([id, rs]) => {
      const e = DB.byId[id];
      const series = months.map(m => rs.find(x => x.mi === m.i) || null);
      const vals = series.filter(Boolean);
      const last = vals[vals.length - 1], prev = vals[vals.length - 2];
      const best = vals.slice().sort(byDesc('ach'))[0];
      const worst = vals.slice().sort((a, b) => a.ach - b.ach)[0];
      const half = Math.max(1, Math.floor(vals.length / 2));
      const trend = pct(avg(vals.slice(half), x => x.ach) - avg(vals.slice(0, half), x => x.ach), avg(vals.slice(0, half), x => x.ach) || 1);
      return {
        e, id, name: e ? e.name : id, dept: rs[0].dept, metric: rs[0].metric, unit: rs[0].unit, money: rs[0].money,
        series, months: vals.length, actual: sum(vals, x => x.actual), target: sum(vals, x => x.target),
        ach: pct(sum(vals, x => x.actual), sum(vals, x => x.target) || 1),
        score: avg(vals, x => x.score), quality: avg(vals, x => x.quality),
        attendancePct: avg(vals, x => x.attendancePct),
        last, prev, delta: last && prev ? last.ach - prev.ach : 0,
        best, worst, trend, secondaryLabel: rs[0].secondaryLabel
      };
    }).sort(byDesc('score'));

    const monthly = months.map(m => {
      const rs = rows.filter(x => x.mi === m.i);
      return {
        key: m.key, mi: m.i, headcount: rs.length,
        ach: round(avg(rs, x => x.ach), 1), score: round(avg(rs, x => x.score), 1),
        above: rs.filter(x => x.ach >= 100).length, below: rs.filter(x => x.ach < 70).length
      };
    });
    const byDept = Object.entries(groupBy(rows, x => x.dept)).map(([k, v]) => ({
      k, v: round(avg(v, x => x.ach), 1), score: round(avg(v, x => x.score), 1),
      series: months.map(m => round(avg(v.filter(x => x.mi === m.i), x => x.ach), 1))
    })).sort(byDesc('v'));

    const cur = monthly[monthly.length - 1] || {}, pre = monthly[monthly.length - 2] || {};
    return {
      rows, months, people, monthly, byDept,
      current: cur, previous: pre,
      momAch: (cur.ach || 0) - (pre.ach || 0),
      avgAch: avg(rows, x => x.ach), avgScore: avg(rows, x => x.score),
      consistent: people.filter(p => p.series.filter(Boolean).every(x => x.ach >= 100)).length,
      improving: people.slice().sort(byDesc('trend')).filter(p => p.trend > 2).slice(0, 8),
      declining: people.slice().sort((a, b) => a.trend - b.trend).filter(p => p.trend < -2).slice(0, 8)
    };
  },

  /* ------------------- month-on-month salary / payroll ------------------ */
  payrollMonthly() {
    const emps = Ctx.employees(true), months = Ctx.months(), mi = Ctx.mIdx();
    const ids = new Set(emps.map(e => e.id));
    const rows = DB.payroll.filter(p => ids.has(p.empId) && mi.has(p.mi));
    const byEmp = groupBy(rows, p => p.empId);
    const people = emps.map(e => {
      const rs = byEmp[e.id] || [];
      const series = months.map(m => rs.find(x => x.mi === m.i) || null);
      const vals = series.filter(Boolean);
      const last = vals[vals.length - 1], prev = vals[vals.length - 2];
      const first = vals[0];
      const revisions = DB.salaryHistory.filter(h => h.empId === e.id &&
        h.date >= months[0].date && h.date <= new Date());
      return {
        e, series, months: vals.length,
        gross: sum(vals, x => x.gross), net: sum(vals, x => x.net),
        employerCost: sum(vals, x => x.employerCost), otPay: sum(vals, x => x.otPay),
        deductions: sum(vals, x => x.pf + x.esic + x.pt + x.tds),
        last, prev, mom: last && prev ? pct(last.gross - prev.gross, prev.gross || 1) : 0,
        swing: last && first ? pct(last.gross - first.gross, first.gross || 1) : 0,
        revisions
      };
    }).filter(p => p.months);

    const monthly = months.map(m => {
      const rs = rows.filter(p => p.mi === m.i);
      return {
        key: m.key, mi: m.i, headcount: rs.length,
        gross: sum(rs, x => x.gross), net: sum(rs, x => x.net),
        employerCost: sum(rs, x => x.employerCost), otPay: sum(rs, x => x.otPay),
        pf: sum(rs, x => x.pf), esic: sum(rs, x => x.esic), pt: sum(rs, x => x.pt), tds: sum(rs, x => x.tds),        avgGross: avg(rs, x => x.gross)
      };
    });
    monthly.forEach((m, i) => {
      const p = monthly[i - 1];
      m.mom = p ? pct(m.employerCost - p.employerCost, p.employerCost || 1) : 0;
      m.headcountDelta = p ? m.headcount - p.headcount : 0;
      m.deductions = m.pf + m.esic + m.pt + m.tds;
    });
    const cur = monthly[monthly.length - 1] || {}, pre = monthly[monthly.length - 2] || {};
    const revisions = DB.salaryHistory.filter(h => ids.has(h.empId) && h.date >= months[0].date);
    return {
      rows, months, people, monthly, current: cur, previous: pre,
      mom: cur.employerCost && pre.employerCost ? pct(cur.employerCost - pre.employerCost, pre.employerCost) : 0,
      total: sum(monthly, m => m.employerCost), totalGross: sum(monthly, m => m.gross),
      totalNet: sum(monthly, m => m.net), totalOt: sum(monthly, m => m.otPay),
      peak: monthly.slice().sort(byDesc('employerCost'))[0] || {},
      revisions, revisionCost: sum(revisions, h => (h.to - h.from) * 12)
    };
  },

function median(arr) { if (!arr.length) return 0; const a = arr.slice().sort((x, y) => x - y); const m = Math.floor(a.length / 2); return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; }

/* ============================ BUSINESS HEALTH =========================== */
/* Every component scores 0–100 against a stated benchmark, then a weighted
   mean produces the headline. Nothing here is random.                      */
function healthScore() {
  const f = Agg.finance(), p = Agg.people(), s = Agg.sales(), cs = Agg.cs();
  const st = Agg.startup(), prod = Agg.production();
  const norm = (v, bad, good) => clamp(((v - bad) / (good - bad)) * 100, 0, 100);
  const revPerEmp = p.headcount ? f.revenue / p.headcount : 0;
  const comps = [
    { n: 'Revenue vs target', w: 1.4, score: norm(f.achievement, 70, 110), val: fmtP(f.achievement), note: `${fmtINR(f.revenue)} against ${fmtINR(f.target)}` },
    { n: 'Revenue growth', w: 1.1, score: norm(f.growth, -8, 18), val: fmtP(f.growth), note: 'second half vs first half of the window' },
    { n: 'Net margin', w: 1.3, score: norm(f.netMargin, -6, 22), val: fmtP(f.netMargin), note: `${fmtINR(f.profit)} profit after payroll` },
    { n: 'Cash position', w: 1.0, score: norm(f.cash / Math.max(1, f.revenue / Math.max(1, Ctx.months().length)), 0.5, 6), val: fmtINR(f.cash), note: 'months of revenue held as cash' },
    { n: 'Employee productivity', w: 1.0, score: norm(revPerEmp / 100000, 3, 40), val: fmtINR(revPerEmp), note: 'revenue per active employee' },
    { n: 'Attrition control', w: 1.1, score: norm(30 - p.attrition, 8, 26), val: fmtP(p.attrition), note: `${p.exits} exits in window, annualised` },
    { n: 'Customer retention', w: 1.0, score: norm(cs.retention, 72, 97), val: fmtP(cs.retention), note: `${cs.churned} accounts churned` },
    { n: 'Payroll efficiency', w: .9, score: norm(45 - f.payrollShare, 8, 32), val: fmtP(f.payrollShare), note: 'payroll cost as share of revenue' },
    { n: 'Attendance', w: .8, score: norm(p.attendancePct, 82, 97), val: fmtP(p.attendancePct), note: 'present days vs scheduled days' }
  ];
  if (prod) comps.push({ n: 'Plant OEE', w: 1.2, score: norm(prod.oee, 45, 85), val: fmtP(prod.oee), note: `availability ${fmtP(prod.availability)} · quality ${fmtP(prod.qual)}` });
  if (st) comps.push({ n: 'Runway', w: 1.3, score: norm(isFinite(st.runway) ? st.runway : 36, 3, 24), val: isFinite(st.runway) ? round(st.runway, 1) + ' mo' : 'profitable', note: `burn ${fmtINR(st.burn)}/mo on ${fmtINR(st.cash)} cash` });
  if (st) comps.push({ n: 'LTV : CAC', w: 1.1, score: norm(st.ltvCac, .8, 4), val: round(st.ltvCac, 2) + 'x', note: `CAC ${fmtINR(st.cac)} · LTV ${fmtINR(st.ltv)}` });
  const total = sum(comps, c => c.w);
  const score = Math.round(sum(comps, c => c.score * c.w) / total);
  comps.sort((a, b) => a.score - b.score);
  return {
    score, comps,
    band: score >= 80 ? 'Strong' : score >= 65 ? 'Stable' : score >= 50 ? 'Needs attention' : 'At risk',
    tone: score >= 80 ? 'pos' : score >= 65 ? 'brand' : score >= 50 ? 'warn' : 'neg',
    drag: comps.slice(0, 2), lift: comps.slice(-2).reverse()
  };
}

/* ============================ SMART INSIGHTS ============================ */
function insights() {
  const out = [];
  const f = Agg.finance(), p = Agg.people(), s = Agg.sales(), r = Agg.recruitment(),
    cs = Agg.cs(), c = Agg.compliance(), prod = Agg.production(), st = Agg.startup(),
    mt = Agg.maintenance(), sf = Agg.safety(), pr = Agg.procurement();
  const add = (tone, text, why) => out.push({ tone, text, why });

  if (f.achievement >= 100) add('good', `Revenue is at ${fmtP(f.achievement)} of target for the selected window.`, `${fmtINR(f.revenue)} booked against a ${fmtINR(f.target)} plan.`);
  else if (f.achievement < 92) add('bad', `Revenue is tracking ${fmtP(100 - f.achievement)} below target.`, `Gap of ${fmtINR(f.target - f.revenue)} across ${Ctx.months().length} months.`);
  if (f.netMargin < 4) add('warn', `Net margin is thin at ${fmtP(f.netMargin)}.`, `Payroll alone is ${fmtP(f.payrollShare)} of revenue.`);
  if (f.payrollShare > 34) add('warn', `Payroll cost has reached ${fmtP(f.payrollShare)} of revenue.`, `${fmtINR(f.payrollCost)} employer cost against ${fmtINR(f.revenue)} revenue.`);
  const pm = f.monthly;
  if (pm.length >= 4) {
    const last = pm.slice(-3), prev = pm.slice(-6, -3);
    const d = pct(sum(last, x => x.revenue) - sum(prev, x => x.revenue), sum(prev, x => x.revenue) || 1);
    if (Math.abs(d) > 6) add(d > 0 ? 'good' : 'bad', `Revenue is ${d > 0 ? 'up' : 'down'} ${fmtP(Math.abs(d))} over the last quarter.`, `Comparing ${last[0].key}–${last[2].key} with the preceding quarter.`);
  }
  if (p.attrition > 18) add('bad', `Attrition is running at ${fmtP(p.attrition)} annualised.`, `${p.exits} exits, ${p.regrettable} of them regrettable.`);
  else if (p.attrition < 9) add('good', `Attrition is controlled at ${fmtP(p.attrition)}.`, `Average tenure is ${round(p.avgTenure, 1)} years.`);
  const worstDept = p.attritionByDept[0];
  if (worstDept && p.exits > 3 && worstDept.v / p.exits > .3) add('warn', `${worstDept.k} accounts for ${fmtP(pct(worstDept.v, p.exits))} of all exits.`, `${worstDept.v} of ${p.exits} exits came from one department.`);
  if (p.attendancePct < 90) add('warn', `Attendance is at ${fmtP(p.attendancePct)} against scheduled days.`, `${fmtN(sum(Ctx.rows(DB.attendance), a => a.absent))} absent days in the window.`);
  if (p.otHours > p.headcount * 12) add('warn', `Overtime is high at ${fmtN(p.otHours)} hours.`, `That is ${round(p.otHours / Math.max(1, p.headcount), 1)} hours per employee; ${fmtINR(p.otPay)} paid out.`);
  if (r.ttf > 45) add('warn', `Time to hire has stretched to ${round(r.ttf, 0)} days.`, `${r.open} requisitions are still open.`);
  if (r.offerDrop > 20) add('bad', `Offer drop-out is ${fmtP(r.offerDrop)}.`, `${r.offers - r.joined} of ${r.offers} offers did not join.`);
  if (p.lowPerf > p.headcount * .1) add('warn', `${p.lowPerf} employees rated below 2.6 in ${p.latestCycle}.`, `That is ${fmtP(pct(p.lowPerf, p.headcount))} of the headcount in scope.`);
  if (cs.churnRate > 12) add('bad', `Customer churn is ${fmtP(cs.churnRate)}.`, `${cs.churned} accounts lost of ${cs.customers}.`);
  else if (cs.retention > 92) add('good', `Customer retention is holding at ${fmtP(cs.retention)}.`, `${cs.active} active accounts worth ${fmtINR(cs.arr)} ARR.`);
  if (cs.renewalsDue > 0) add('warn', `${cs.renewalsDue} accounts come up for renewal inside 3 months.`, `Combined value sits in the ${fmtINR(cs.arr / Math.max(1, cs.active) * cs.renewalsDue)} range.`);
  if (c.overdue > 0) add('bad', `${c.overdue} compliance items are overdue.`, `${c.high} of the open items carry a high risk rating.`);
  if (c.due30 > 0) add('warn', `${c.due30} statutory items fall due in the next 30 days.`, 'Owners are listed in the compliance command centre.');
  if (prod) {
    if (prod.achievement < 95) add('bad', `Production is at ${fmtP(prod.achievement)} of plan.`, `Shortfall of ${fmtN(prod.target - prod.actual)} ${prod.uom}.`);
    else add('good', `Production achieved ${fmtP(prod.achievement)} of plan.`, `${fmtN(prod.actual)} ${prod.uom} against a plan of ${fmtN(prod.target)}.`);
    if (prod.oee < 65) add('warn', `OEE of ${fmtP(prod.oee)} is below the 65% benchmark.`, `Availability ${fmtP(prod.availability)}, performance ${fmtP(prod.perf)}, quality ${fmtP(prod.qual)}.`);
    if (prod.rejectionPct > 3) add('bad', `Rejection is ${fmtP(prod.rejectionPct)} of output.`, `Cost of quality for the window is ${fmtINR(prod.costOfQuality)}.`);
  }
  if (mt && mt.pmCompliance < 80) add('warn', `Preventive maintenance completion is ${fmtP(mt.pmCompliance)}.`, `${mt.pmDue} machines are overdue for PM; ${mt.critical} are flagged critical.`);
  if (sf && sf.lti > 0) add('bad', `${sf.lti} lost-time injuries recorded.`, `${sf.nearMiss} near misses were also reported — the leading indicator to act on.`);
  if (st) {
    if (isFinite(st.runway) && st.runway < 9) add('bad', `Runway is ${round(st.runway, 1)} months at the current burn.`, `${fmtINR(st.burn)} average monthly burn against ${fmtINR(st.cash)} cash.`);
    else if (isFinite(st.runway)) add('good', `Runway stands at ${round(st.runway, 1)} months.`, `Burn is averaging ${fmtINR(st.burn)} a month.`);
    if (st.ltvCac < 3) add('warn', `LTV to CAC is ${round(st.ltvCac, 2)}x, under the 3x benchmark.`, `CAC ${fmtINR(st.cac)} against an LTV of ${fmtINR(st.ltv)}.`);
    else add('good', `LTV to CAC is healthy at ${round(st.ltvCac, 2)}x.`, `Payback is roughly ${round(st.cac / Math.max(1, st.arpu * st.grossMargin / 100), 1)} months.`);
    if (st.mrrGrowth > 0) add('good', `MRR grew ${fmtP(st.mrrGrowth)} across the window.`, `Now at ${fmtINR(st.mrr)} MRR / ${fmtINR(st.arr)} ARR.`);
  }
  if (pr.savingPct > 6) add('good', `Procurement negotiated ${fmtP(pr.savingPct)} off quoted value.`, `${fmtINR(pr.saving)} saved across ${pr.count} purchase orders.`);
  if (pr.delayedPct > 20) add('warn', `${fmtP(pr.delayedPct)} of purchase orders ran late.`, `${pr.delayed} delayed orders against an average cycle of ${round(pr.cycle, 0)} days.`);
  if (s.reps.length) {
    const top = s.reps[0], weak = s.reps.filter(x => x.ach < 70).length;
    if (top) add('good', `${top.name} leads sales with ${fmtP(top.ach)} of target.`, `${fmtINR(top.revenue)} from ${top.deals} deals.`);
    if (weak > 0) add('warn', `${weak} sellers are below 70% of target.`, 'Coaching or territory rebalancing is the usual first move.');
  }
  return out.slice(0, 12);
}

/* =========================================================================
   CHARTS — hand-rolled interactive SVG, no external libraries.
   Every chart ships its data in a data-viz attribute; Chart.hydrate() wires
   up hover, crosshair, tooltips and legend toggling after each render.
   ========================================================================= */
const PAL = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)'];
const PAL_HEX = ['#2B4ACB', '#12795C', '#A66A12', '#7A46B8', '#0E7490', '#B23B36'];
let VIZ_SEQ = 0;

function niceMax(v) {
  if (v <= 0) return 10;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function tickLabel(v, fmt) { return fmt === 'inr' ? fmtINR(v) : fmt === 'pct' ? round(v, 0) + '%' : fmtN(round(v, v < 10 ? 1 : 0)); }
function vizAttr(cfg) { return JSON.stringify(cfg).replace(/'/g, '&#39;').replace(/</g, '\\u003c'); }
function hexOf(color, i) {
  if (color && color.indexOf('var(') !== 0) return color;
  const map = { 'var(--s1)': '#2B4ACB', 'var(--s2)': '#12795C', 'var(--s3)': '#A66A12', 'var(--s4)': '#7A46B8', 'var(--s5)': '#0E7490', 'var(--s6)': '#B23B36', 'var(--ink-3)': '#78808D', 'var(--pos)': '#12795C', 'var(--warn)': '#A66A12', 'var(--neg)': '#B23B36', 'var(--brand)': '#2B4ACB' };
  return map[color] || PAL_HEX[i % PAL_HEX.length];
}

/* monotone cubic smoothing — keeps curves from overshooting the data */
function smoothPath(pts) {
  if (pts.length < 3) return 'M' + pts.map(p => p.join(' ')).join(' L');
  let d = 'M' + pts[0][0] + ' ' + pts[0][1];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const t = 0.22;
    const c1x = p1[0] + (p2[0] - p0[0]) * t, c1y = p1[1] + (p2[1] - p0[1]) * t;
    const c2x = p2[0] - (p3[0] - p1[0]) * t, c2y = p2[1] - (p3[1] - p1[1]) * t;
    d += ` C${round(c1x, 1)} ${round(c1y, 1)}, ${round(c2x, 1)} ${round(c2y, 1)}, ${round(p2[0], 1)} ${round(p2[1], 1)}`;
  }
  return d;
}

const Chart = {
  /* ------------------------------------------------------------- line */
  line(o) {
    const W = 720, H = o.height || 240, P = { t: 18, r: 16, b: 28, l: 58 };
    const labels = o.labels || [], series = (o.series || []).filter(s => s && s.values);
    if (!labels.length || !series.length) return Chart.none();
    const id = 'v' + (++VIZ_SEQ);
    const all = series.flatMap(s => s.values.map(v => Number(v) || 0));
    const min = o.min != null ? o.min : Math.min(0, Math.min(...all));
    const max = niceMax(Math.max(...all, 1) * 1.06);
    const x = i => P.l + (labels.length === 1 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (labels.length - 1));
    const y = v => H - P.b - (((Number(v) || 0) - min) / (max - min || 1)) * (H - P.t - P.b);
    const band = (W - P.l - P.r) / Math.max(1, labels.length - 1);

    let grid = '';
    for (let i = 0; i <= 4; i++) {
      const v = min + (max - min) * i / 4;
      grid += `<line class="gl" x1="${P.l}" y1="${round(y(v), 1)}" x2="${W - P.r}" y2="${round(y(v), 1)}"/>`;
      grid += `<text x="${P.l - 8}" y="${round(y(v) + 3.5, 1)}" text-anchor="end">${tickLabel(v, o.fmt)}</text>`;
    }
    const step = Math.ceil(labels.length / 12);
    labels.forEach((l, i) => {
      if (i % step === 0 || i === labels.length - 1) grid += `<text x="${round(x(i), 1)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`;
    });

    /* average reference line for the primary series — reads at a glance */
    let refs = '';
    const prim = series[0].values.map(v => Number(v) || 0);
    if (o.showAvg !== false && prim.length > 2) {
      const mean = avg(prim);
      refs += `<line class="ref" x1="${P.l}" y1="${round(y(mean), 1)}" x2="${W - P.r}" y2="${round(y(mean), 1)}"/>
        <text class="ref-t" x="${W - P.r}" y="${round(y(mean) - 5, 1)}" text-anchor="end">avg ${tickLabel(mean, o.fmt)}</text>`;
    }

    let defs = '', body = '';
    series.forEach((s, si) => {
      const col = s.color || PAL[si % PAL.length], hex = hexOf(s.color, si);
      const pts = s.values.map((v, i) => [x(i), y(v)]);
      const path = o.smooth === false || pts.length < 3 ? 'M' + pts.map(p => `${round(p[0], 1)} ${round(p[1], 1)}`).join(' L') : smoothPath(pts);
      if ((o.area || series.length === 1) && si === 0) {
        defs += `<linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${hex}" stop-opacity=".26"/><stop offset="100%" stop-color="${hex}" stop-opacity="0"/></linearGradient>`;
        body += `<path class="area" data-si="${si}" d="${path} L${round(x(labels.length - 1), 1)} ${round(y(min), 1)} L${round(x(0), 1)} ${round(y(min), 1)} Z" fill="url(#${id}g)"/>`;
      }
      body += `<path class="line" data-si="${si}" d="${path}" fill="none" stroke="${col}" stroke-width="2.4"
        stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="6 5" style="animation:none"' : ''} style="animation-delay:${si * .12}s"/>`;
      s.values.forEach((v, i) => {
        body += `<circle class="dot" data-si="${si}" data-i="${i}" cx="${round(x(i), 1)}" cy="${round(y(v), 1)}" r="4" fill="var(--surface)" stroke="${col}" stroke-width="2.4"/>`;
      });
      /* peak and trough markers on a single-series chart */
      if (series.length === 1 && s.values.length > 3 && o.markers !== false) {
        const hi = s.values.indexOf(Math.max(...s.values)), lo = s.values.indexOf(Math.min(...s.values));
        body += `<circle class="peak" cx="${round(x(hi), 1)}" cy="${round(y(s.values[hi]), 1)}" r="4.5" fill="${col}"/>`;
        body += `<circle class="peak low" cx="${round(x(lo), 1)}" cy="${round(y(s.values[lo]), 1)}" r="4.5" fill="var(--surface)" stroke="${col}" stroke-width="2.4"/>`;
      }
    });

    let hits = `<line class="cross" x1="0" y1="${P.t}" x2="0" y2="${H - P.b}"/>`;
    labels.forEach((l, i) => {
      hits += `<rect class="hit" data-i="${i}" data-cx="${round(x(i), 1)}" x="${round(x(i) - band / 2, 1)}" y="${P.t}" width="${round(band || W, 1)}" height="${H - P.t - P.b}"/>`;
    });

    const cfg = { labels, fmt: o.fmt || '', series: series.map((s, si) => ({ name: s.name || 'Value', color: hexOf(s.color, si), values: s.values })) };
    return `<div class="viz" data-viz='${vizAttr(cfg)}'>${Chart.legend(series, o)}
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="xMidYMid meet">
        <defs>${defs}</defs>${grid}${refs}${body}${hits}</svg></div>`;
  },

  /* ------------------------------------------------------------- bars */
  bars(o) {
    const W = 720, H = o.height || 240, P = { t: 18, r: 16, b: 32, l: 60 };
    const labels = o.labels || [], series = (o.series || []).filter(s => s && s.values);
    if (!labels.length || !series.length) return Chart.none();
    const id = 'v' + (++VIZ_SEQ);
    const max = niceMax(Math.max(...series.flatMap(s => s.values.map(v => Number(v) || 0)), 1) * 1.06);
    const bw = (W - P.l - P.r) / labels.length;
    const iw = Math.min(36, (bw * .64) / series.length);
    const y = v => H - P.b - ((Number(v) || 0) / max) * (H - P.t - P.b);

    let grid = '';
    for (let i = 0; i <= 4; i++) {
      const v = max * i / 4;
      grid += `<line class="gl" x1="${P.l}" y1="${round(y(v), 1)}" x2="${W - P.r}" y2="${round(y(v), 1)}"/>`;
      grid += `<text x="${P.l - 8}" y="${round(y(v) + 3.5, 1)}" text-anchor="end">${tickLabel(v, o.fmt)}</text>`;
    }

    let defs = '', body = '', hits = '';
    series.forEach((s, si) => { defs += `<linearGradient id="${id}b${si}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${hexOf(s.color, si)}" stop-opacity="${s.faded ? .38 : 1}"/>
      <stop offset="100%" stop-color="${hexOf(s.color, si)}" stop-opacity="${s.faded ? .2 : .68}"/></linearGradient>`; });

    const step = Math.ceil(labels.length / 14);
    labels.forEach((l, i) => {
      const cx = P.l + bw * i + bw / 2;
      if (i % step === 0 || i === labels.length - 1) {
        const t = String(l).length > 13 ? String(l).slice(0, 12) + '…' : l;
        body += `<text x="${round(cx, 1)}" y="${H - 11}" text-anchor="middle">${esc(t)}</text>`;
      }
      series.forEach((s, si) => {
        const v = Number(s.values[i]) || 0;
        const bx = cx - (iw * series.length) / 2 + si * iw;
        const h = Math.max(0, H - P.b - y(v));
        body += `<rect class="bar" data-si="${si}" data-i="${i}" x="${round(bx, 1)}" y="${round(y(v), 1)}"
          width="${Math.max(2, iw - 3.5)}" height="${round(h, 1)}" rx="3.5" fill="url(#${id}b${si})"
          style="animation-delay:${(i * .028 + si * .06).toFixed(2)}s"/>`;
      });
      hits += `<rect class="hit" data-i="${i}" data-cx="${round(cx, 1)}" x="${round(P.l + bw * i, 1)}" y="${P.t}" width="${round(bw, 1)}" height="${H - P.t - P.b}"/>`;
    });

    const cfg = { labels, fmt: o.fmt || '', series: series.map((s, si) => ({ name: s.name || 'Value', color: hexOf(s.color, si), values: s.values })) };
    return `<div class="viz" data-viz='${vizAttr(cfg)}'>${Chart.legend(series, o)}
      <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="xMidYMid meet">
        <defs>${defs}</defs>${grid}${body}${hits}</svg></div>`;
  },

  /* ------------------------------------------------------ horizontal bars */
  hbar(items, o = {}) {
    if (!items || !items.length) return Chart.none();
    const list = items.slice(0, o.limit || 12);
    const max = Math.max(...list.map(i => Math.abs(Number(i.v) || 0)), 1);
    return `<div class="viz hbars">` + list.map((it, i) => {
      const w = Math.max(1.5, pct(Math.abs(Number(it.v) || 0), max));
      const click = o.onClick ? ` onclick="${o.onClick(it)}" role="button" tabindex="0"` : '';
      return `<div class="hb${o.onClick ? ' clickable' : ''}"${click} title="${esc(it.k)}">
        <span class="hb-k">${esc(it.k)}</span>
        <span class="bar-mini"><i style="width:${round(w, 1)}%;background:${it.color || PAL[i % PAL.length]};animation-delay:${(i * .04).toFixed(2)}s"></i></span>
        <b class="hb-v">${o.fmt ? o.fmt(it.v, it) : fmtN(it.v)}</b></div>`;
    }).join('') + `</div>`;
  },

  /* ------------------------------------------------------------- donut */
  donut(items, o = {}) {
    const clean = (items || []).filter(i => (Number(i.v) || 0) > 0);
    if (!clean.length) return Chart.none();
    const total = sum(clean, i => Number(i.v) || 0);
    const R = 62, C = 2 * Math.PI * R;
    let off = 0;
    const segs = clean.map((it, i) => {
      const frac = (Number(it.v) || 0) / total, len = frac * C;
      const el = `<circle class="donut-seg" data-k="${esc(it.k)}" data-v="${o.fmt ? esc(o.fmt(it.v)) : fmtN(it.v)}" data-p="${fmtP(frac * 100)}"
        cx="90" cy="90" r="${R}" fill="none" stroke="${it.color || PAL[i % PAL.length]}" stroke-width="24"
        stroke-dasharray="${round(len, 2)} ${round(C - len, 2)}" stroke-dashoffset="${round(-off, 2)}"
        transform="rotate(-90 90 90)" style="animation-delay:${(i * .07).toFixed(2)}s"/>`;
      off += len; return el;
    }).join('');
    const legend = clean.map((it, i) => `<div class="dl-row" data-k="${esc(it.k)}">
        <i style="background:${it.color || PAL[i % PAL.length]}"></i>
        <span class="dl-k">${esc(it.k)}</span>
        <b>${o.fmt ? o.fmt(it.v) : fmtN(it.v)}</b><span class="muted dl-p">${fmtP(pct(it.v, total), 0)}</span>
      </div>`).join('');
    return `<div class="viz donut-wrap">
      <svg viewBox="0 0 180 180" class="donut-svg">${segs}
        <text class="donut-top" x="90" y="86" text-anchor="middle">${o.centerTop || fmtN(total)}</text>
        <text class="donut-sub" x="90" y="103" text-anchor="middle">${esc(o.centerLabel || 'total')}</text>
      </svg><div class="donut-legend">${legend}</div></div>`;
  },

  /* ------------------------------------------------------------ funnel */
  funnel(steps, o = {}) {
    if (!steps.length) return Chart.none();
    const max = steps[0][1] || 1;
    return `<div class="viz funnel">` + steps.map(([k, v], i) => {
      const w = Math.max(6, pct(v, max));
      const drop = i ? pct(steps[i - 1][1] - v, steps[i - 1][1] || 1) : 0;
      const keep = i ? pct(v, steps[i - 1][1] || 1) : 100;
      return `<div class="fn-row" title="${esc(k)}: ${fmtN(v)}${i ? ` · ${fmtP(keep)} carried through from ${esc(steps[i - 1][0])}` : ''}">
        <span class="fn-k">${esc(k)}</span>
        <div class="fn-track">
          <div class="fn-bar" style="width:${round(w, 1)}%;animation-delay:${(i * .07).toFixed(2)}s;opacity:${(1 - i * .06).toFixed(2)}"></div>
          <b class="fn-v">${fmtN(v)}</b>
          ${i ? `<span class="fn-d">−${fmtP(drop, 0)}</span>` : ''}
        </div></div>`;
    }).join('') + `</div>`;
  },

  /* ------------------------------------------------------------- gauge */
  gauge(v, o = {}) {
    const max = o.max || 100, val = clamp(Number(v) || 0, 0, max);
    const R = 66, C = Math.PI * R, len = (val / max) * C;
    const col = o.color || (val >= 80 ? 'var(--pos)' : val >= 60 ? 'var(--s1)' : val >= 45 ? 'var(--warn)' : 'var(--neg)');
    const ang = Math.PI * (1 - val / max);
    const nx = 90 + Math.cos(ang) * (R - 22), ny = 92 - Math.sin(ang) * (R - 22);
    return `<div class="viz"><svg viewBox="0 0 180 112" class="gauge-svg" role="img">
      <path d="M14 92 A ${R} ${R} 0 0 1 166 92" fill="none" stroke="var(--line-2)" stroke-width="15" stroke-linecap="round"/>
      <path class="gauge-arc" d="M14 92 A ${R} ${R} 0 0 1 166 92" fill="none" stroke="${col}" stroke-width="15" stroke-linecap="round"
        stroke-dasharray="${round(len, 2)} ${round(C - len, 2)}"/>
      <line class="gauge-needle" x1="90" y1="92" x2="${round(nx, 1)}" y2="${round(ny, 1)}" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="90" cy="92" r="4" fill="${col}"/>
      <text class="gauge-val" x="90" y="76" text-anchor="middle">${o.label || round(val, 1)}</text>
      <text class="gauge-sub" x="90" y="106" text-anchor="middle">${esc(o.sub || '')}</text></svg></div>`;
  },

  /* ------------------------------------------------------------ sparkline */
  spark(values, o = {}) {
    const vals = (values || []).map(v => Number(v) || 0);
    if (vals.length < 2) return '';
    const id = 'sp' + (++VIZ_SEQ);
    const W = 100, H = 26, min = Math.min(...vals), max = Math.max(...vals);
    const pts = vals.map((v, i) => [i * W / (vals.length - 1), H - 2 - ((v - min) / (max - min || 1)) * (H - 6)]);
    const up = vals[vals.length - 1] >= vals[0];
    const hex = up ? '#12795C' : '#B23B36';
    const d = smoothPath(pts);
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${hex}" stop-opacity=".3"/><stop offset="100%" stop-color="${hex}" stop-opacity="0"/></linearGradient></defs>
      <path d="${d} L${W} ${H} L0 ${H} Z" fill="url(#${id})"/>
      <path class="spark-line" d="${d}" fill="none" stroke="${hex}" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="${round(pts[pts.length - 1][0], 1)}" cy="${round(pts[pts.length - 1][1], 1)}" r="2.2" fill="${hex}"/></svg>`;
  },

  stacked(items, o = {}) {
    const total = sum(items, i => Number(i.v) || 0) || 1;
    return `<div class="stack">` + items.map((it, i) =>
      `<i style="width:${round(pct(it.v, total), 2)}%;background:${it.color || PAL[i % PAL.length]}" title="${esc(it.k)}: ${fmtN(it.v)}"></i>`).join('') + `</div>`;
  },

  /* legend doubles as a series toggle, plus an automatic trend badge */
  legend(series, o = {}) {
    const named = (series || []).filter(s => s.name);
    let badge = '';
    if (o.trend !== false && series.length && series[0].values && series[0].values.length > 2) {
      const v = series[0].values.map(x => Number(x) || 0);
      const half = Math.max(1, Math.floor(v.length / 2));
      const a = avg(v.slice(0, half)), b = avg(v.slice(half));
      const ch = pct(b - a, Math.abs(a) || 1);
      if (isFinite(ch) && Math.abs(ch) >= 0.5) {
        badge = `<span class="viz-trend ${ch > 0 ? 'up' : 'down'}" title="second half of the window against the first">
          ${ch > 0 ? '▲' : '▼'} ${fmtP(Math.abs(ch))}</span>`;
      }
    }
    if (named.length < 2 && !badge) return '';
    const items = named.length < 2 ? '' : named.map((s, i) =>
      `<span class="li" data-si="${series.indexOf(s)}"><i style="background:${s.color || PAL[i % PAL.length]}"></i>${esc(s.name)}</span>`).join('');
    return `<div class="legend">${items}${badge}</div>`;
  },

  none() { return `<div class="empty"><div class="t">No data in this range</div><div>Widen the date window or clear the department filter.</div></div>`; },

  /* --------------------------------------------------------- interactivity */
  tipEl() {
    let t = document.querySelector('#vizTip');
    if (!t) {
      t = document.createElement('div');
      t.id = 'vizTip'; t.className = 'viz-tip';
      document.body.appendChild(t);
    }
    return t;
  },
  place(tip, ev) {
    const pad = 14, w = tip.offsetWidth || 160, h = tip.offsetHeight || 60;
    let x = ev.clientX + pad, y = ev.clientY - h - 10;
    if (x + w > window.innerWidth - 8) x = ev.clientX - w - pad;
    if (y < 8) y = ev.clientY + pad;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  },
  showPoint(tip, ev, cfg, i) {
    const rows = cfg.series.map(s => {
      const v = s.values[i];
      if (v == null) return '';
      return `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><b>${tickLabel(v, cfg.fmt)}</b></div>`;
    }).join('');
    tip.innerHTML = `<div class="t">${esc(cfg.labels[i])}</div>${rows}`;
    tip.classList.add('on'); Chart.place(tip, ev);
  },
  showText(tip, ev, title, rows) {
    tip.innerHTML = `<div class="t">${esc(title)}</div>${rows}`;
    tip.classList.add('on'); Chart.place(tip, ev);
  },
  hide() { const t = document.querySelector('#vizTip'); if (t) t.classList.remove('on'); },

  hydrate(root) {
    const scope = root || document;
    const tip = Chart.tipEl();
    $$('.viz', scope).forEach(viz => {
      const svg = viz.querySelector('svg');
      let cfg = null;
      const raw = viz.getAttribute('data-viz');
      if (raw) { try { cfg = JSON.parse(raw); } catch (e) { cfg = null; } }

      if (svg && cfg) {
        const cross = svg.querySelector('.cross');
        const dots = $$('.dot', svg), bars = $$('.bar', svg);
        const focus = (i, ev) => {
          Chart.showPoint(tip, ev, cfg, i);
          dots.forEach(d => d.classList.toggle('on', Number(d.dataset.i) === i));
          bars.forEach(b => b.classList.toggle('dim', Number(b.dataset.i) !== i));
          if (cross) {
            const cx = ev.currentTarget.dataset.cx;
            cross.setAttribute('x1', cx); cross.setAttribute('x2', cx);
            cross.classList.add('on');
          }
        };
        $$('.hit', svg).forEach(hit => {
          hit.addEventListener('mousemove', ev => focus(Number(hit.dataset.i), ev));
          hit.addEventListener('touchstart', ev => {
            const t0 = ev.touches[0];
            focus(Number(hit.dataset.i), { clientX: t0.clientX, clientY: t0.clientY, currentTarget: hit });
          }, { passive: true });
        });
        svg.addEventListener('mouseleave', () => {
          Chart.hide();
          dots.forEach(d => d.classList.remove('on'));
          bars.forEach(b => b.classList.remove('dim'));
          if (cross) cross.classList.remove('on');
        });
      }

      /* legend entries switch a series off without redrawing the axes */
      $$('.legend .li', viz).forEach(li => {
        li.addEventListener('click', () => {
          const si = li.dataset.si, off = li.classList.toggle('off');
          $$(`[data-si="${si}"]`, viz).forEach(el => {
            if (el.classList.contains('li')) return;
            el.style.display = off ? 'none' : '';
          });
        });
      });

      /* donut segments report their own share */
      $$('.donut-seg', viz).forEach(seg => {
        const show = ev => Chart.showText(tip, ev, seg.dataset.k,
          `<div class="r"><span>Value</span><b>${esc(seg.dataset.v)}</b></div><div class="r"><span>Share</span><b>${esc(seg.dataset.p)}</b></div>`);
        seg.addEventListener('mousemove', show);
        seg.addEventListener('mouseleave', Chart.hide);
        const row = viz.querySelector(`.dl-row[data-k="${(seg.dataset.k || '').replace(/"/g, '\\"')}"]`);
        if (row) {
          seg.addEventListener('mouseenter', () => row.classList.add('on'));
          seg.addEventListener('mouseleave', () => row.classList.remove('on'));
          row.addEventListener('mouseenter', () => seg.classList.add('on'));
          row.addEventListener('mouseleave', () => seg.classList.remove('on'));
        }
      });
    });
  }
};
window.addEventListener('scroll', () => Chart.hide(), { passive: true });

/* =========================================================================
   UI BUILDERS
   ========================================================================= */
const UI = {
  kpi(lab, val, o = {}) {
    const d = o.delta;
    const dTag = d == null ? '' :
      `<span class="delta ${d > 0.05 ? 'up' : d < -0.05 ? 'down' : 'flat'}">${d > 0 ? '▲' : d < 0 ? '▼' : '■'} ${fmtP(Math.abs(d))}</span>`;
    const bar = o.bar != null ? `<span class="bar-mini" style="flex:1;min-width:60px"><i style="width:${clamp(o.bar, 0, 100)}%;background:${o.barColor || 'var(--brand)'}"></i></span>` : '';
    return `<div class="kpi"${o.title ? ` title="${esc(o.title)}"` : ''}>
      <span class="lab">${esc(lab)}</span>
      <span class="val" style="${o.color ? 'color:' + o.color : ''}">${val}</span>
      <span class="foot">${dTag}${o.foot ? `<span>${o.foot}</span>` : ''}${bar}${o.spark || ''}</span></div>`;
  },
  card(title, body, o = {}) {
    return `<section class="card">
      ${title ? `<div class="card-h"><h3>${esc(title)}</h3>${o.sub ? `<span class="muted" style="font-size:12px">${esc(o.sub)}</span>` : ''}
        <div class="acts">${o.actions || ''}</div></div>` : ''}
      <div class="card-b ${o.tight ? 'tight' : ''}">${body}</div></section>`;
  },
  table(cols, rows, o = {}) {
    if (!rows.length) return `<div class="empty"><div class="t">${esc(o.emptyTitle || 'Nothing to show')}</div><div>${esc(o.emptyBody || 'Adjust the filters above to widen the scope.')}</div></div>`;
    const head = cols.map(c => `<th class="${c.r ? 'r' : ''}">${esc(c.h)}</th>`).join('');
    const body = rows.slice(0, o.limit || 300).map((r, i) => {
      const tds = cols.map(c => `<td class="${c.r ? 'r' : ''}">${c.f(r, i)}</td>`).join('');
      return `<tr class="${o.onRow ? 'clickable' : ''}" ${o.onRow ? `onclick="${o.onRow(r)}"` : ''}>${tds}</tr>`;
    }).join('');
    const more = rows.length > (o.limit || 300) ? `<div class="muted" style="padding:8px 12px;font-size:12px">Showing ${o.limit || 300} of ${fmtN(rows.length)} rows. Export for the full set.</div>` : '';
    return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${more}`;
  },
  empName(e) {
    return `<span class="emp-cell"><span class="avatar">${esc(initials(e.name))}</span><span>${esc(e.name)}<br><span class="muted" style="font-size:11px">${esc(e.id)} · ${esc(e.desig || e.dept)}</span></span></span>`;
  },
  money(v, empId) {
    if (empId && !Access.canSeeSalary(empId)) return `<span class="muted" title="Restricted for your role">•••</span>`;
    return fmtINR(v);
  },
  statusTag(s) {
    const m = { 'Completed': 'pos', 'Active': 'pos', 'Delivered': 'pos', 'Closed': 'pos', 'Live': 'pos', 'Good': 'pos', 'Open': 'brand', 'In progress': 'brand', 'In transit': 'brand', 'Pending': 'warn', 'On hold': 'warn', 'Paused': 'warn', 'Watch': 'warn', 'Overdue': 'neg', 'Critical': 'neg', 'Churned': 'neg', 'Exited': 'neg', 'Cancelled': 'neg' };
    return `<span class="tag ${m[s] || ''}">${esc(s)}</span>`;
  },
  ach(v) { return `<span class="tag ${v >= 100 ? 'pos' : v >= 85 ? 'warn' : 'neg'}">${fmtP(v)}</span>`; },
  sectionTabs(items, active, fn) {
    return `<div class="tabs">` + items.map(([id, label]) =>
      `<button class="tab ${id === active ? 'on' : ''}" onclick="${fn}('${id}')">${esc(label)}</button>`).join('') + `</div>`;
  },
  insightList(list) {
    if (!list.length) return `<div class="empty"><div class="t">Nothing needs your attention</div><div>Every tracked metric is inside its expected band for this scope.</div></div>`;
    return list.map(i => `<div class="insight ${i.tone}"><span class="ic">${i.tone === 'good' ? '✓' : i.tone === 'bad' ? '!' : '⚠'}</span>
      <span><span>${esc(i.text)}</span><div class="why">${esc(i.why)}</div></span></div>`).join('');
  },
  toolbar(exportKey, extra) {
    return `${extra || ''}<button class="btn btn-sm" onclick="Export.run('${exportKey}')">Export CSV</button>`;
  }
};

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(6px)'; el.style.transition = 'all .3s'; }, 2600);
  setTimeout(() => el.remove(), 3000);
}

function healthBlock(h) {
  return `<div class="health">

      <div class="score" style="color:var(--${h.tone === 'brand' ? 'brand' : h.tone})">${h.score}<span> / 100</span></div>

      it is carried by <b>${esc(h.lift.map(c => c.n.toLowerCase()).join(' and '))}</b>.</p>`;

function deptScorecard() {
  const rows = DB.departments.map(d => {
    const emps = DB.employees.filter(e => e.dept === d.name && e.status === 'Active');
    const pay = DB.payroll.filter(p => p.dept === d.name && Ctx.mIdx().has(p.mi));
    const att = DB.attendance.filter(a => a.dept === d.name && Ctx.mIdx().has(a.mi));
    const perf = DB.performance.filter(p => p.dept === d.name && p.cycle === DB.cycles[DB.cycles.length - 1]);
    const exits = DB.exits.filter(x => x.dept === d.name && Ctx.mIdx().has(x.mi));
    const bud = DB.finance.budget.find(b => b.dept === d.name) || { budget: 0, actual: 0 };
    return {
      name: d.name, head: DB.byId[d.headId], headcount: emps.length,
      payroll: sum(pay, p => p.employerCost),
      attendance: pct(sum(att, a => a.present), sum(att, a => a.workDays) || 1),
      rating: avg(perf, p => p.rating), attrition: pct(exits.length, emps.length || 1),
      variance: pct(bud.budget - bud.actual, bud.budget || 1)
    };
  }).sort(byDesc('headcount'));
  return UI.table([
    { h: 'Department', f: r => `<b>${esc(r.name)}</b>` },
    { h: 'Head', f: r => r.head ? `${esc(r.head.name)}<br><span class="muted" style="font-size:11px">${esc(r.head.id)}</span>` : '—' },
    { h: 'Headcount', r: 1, f: r => fmtN(r.headcount) },
    { h: 'Payroll cost', r: 1, f: r => fmtINR(r.payroll) },
    { h: 'Attendance', r: 1, f: r => fmtP(r.attendance) },
    { h: 'Avg rating', r: 1, f: r => round(r.rating, 2) || '—' },
    { h: 'Attrition', r: 1, f: r => `<span class="tag ${r.attrition > 18 ? 'neg' : r.attrition > 10 ? 'warn' : 'pos'}">${fmtP(r.attrition)}</span>` },
    { h: 'Budget variance', r: 1, f: r => `<span class="${r.variance < 0 ? 'tag neg' : 'tag pos'}">${fmtP(r.variance)}</span>` }
  ], rows, { onRow: r => `App.jumpDept('${esc(r.name)}')` });
}

Views.hr = function () {

function employeeTable(list) {
  const rows = (list || Ctx.employees(true)).slice().sort((a, b) => a.dept.localeCompare(b.dept) || a.name.localeCompare(b.name));
  return UI.table([
    { h: 'Employee', f: e => UI.empName(e) },
    { h: 'Department', f: e => esc(e.dept) },
    { h: 'Location', f: e => esc(e.site) },
    { h: 'Type', f: e => esc(e.type) },

/* ---------------------------------------------------- SALARY INTELLIGENCE */
Views.salary = function () {
  const emps = Ctx.employees();
  const p = Agg.people();
  const bands = ['E1', 'M3', 'M2', 'L2', 'W1'].map(b => {
    const list = emps.filter(e => e.band === b);
    return {
      k: { E1: 'Leadership (E1)', M3: 'Department head (M3)', M2: 'Manager (M2)', L2: 'Individual contributor (L2)', W1: 'Shop floor (W1)' }[b],
      v: list.length, avg: avg(list, e => e.ctc), med: median(list.map(e => e.ctc)),
      min: list.length ? Math.min(...list.map(e => e.ctc)) : 0, max: list.length ? Math.max(...list.map(e => e.ctc)) : 0
    };
  }).filter(b => b.v);
  const hist = DB.salaryHistory.filter(h => Ctx.empIds(true).has(h.empId));
  const byDept = Object.entries(groupBy(emps, e => e.dept)).map(([k, v]) => ({ k, v: round(median(v.map(e => e.ctc)), 0), n: v.length })).sort(byDesc('v'));
  const genderGap = (() => {
    const m = avg(emps.filter(e => e.gender === 'Male'), e => e.ctc), f = avg(emps.filter(e => e.gender === 'Female'), e => e.ctc);
    return m ? pct(m - f, m) : 0;
  })();
  return pageHead('Salary intelligence', `Pay structure, spread and increment history for ${esc(Ctx.label())}.`, UI.toolbar('salary')) +
    `<div class="grid g4" style="margin-bottom:14px">
      ${UI.kpi('Average CTC', fmtINR(p.avgCtc), {})}
      ${UI.kpi('Median CTC', fmtINR(p.medianCtc), { foot: `${fmtP(pct(p.avgCtc - p.medianCtc, p.medianCtc || 1))} above median — pay is top-weighted` })}
      ${UI.kpi('Annual payroll commitment', fmtINR(sum(emps, e => e.ctc)), { foot: 'sum of current CTC' })}
      ${UI.kpi('Average increment', fmtP(avg(hist, h => h.pct)), { foot: `${fmtN(hist.length)} revisions on record` })}
      ${UI.kpi('Highest paid band', bands.length ? esc(bands[0].k) : '—', { foot: bands.length ? fmtINR(bands[0].avg) + ' average' : '' })}
      ${UI.kpi('Pay spread', bands.length ? round(Math.max(...emps.map(e => e.ctc)) / Math.max(1, Math.min(...emps.map(e => e.ctc))), 1) + 'x' : '—', { foot: 'highest CTC ÷ lowest CTC' })}
      ${UI.kpi('Gender pay gap', fmtP(genderGap), { color: Math.abs(genderGap) > 12 ? 'var(--warn)' : '', foot: 'unadjusted average difference' })}
      ${UI.kpi('Promotions on record', fmtN(hist.filter(h => h.reason === 'Promotion').length), {})}
    </div>
    <div class="grid g2" style="margin-bottom:14px">
      ${UI.card('Band structure', UI.table([
      { h: 'Band', f: b => `<b>${esc(b.k)}</b>` },
      { h: 'Employees', r: 1, f: b => fmtN(b.v) },
      { h: 'Minimum', r: 1, f: b => fmtINR(b.min) },
      { h: 'Median', r: 1, f: b => fmtINR(b.med) },
      { h: 'Average', r: 1, f: b => fmtINR(b.avg) },
      { h: 'Maximum', r: 1, f: b => fmtINR(b.max) }
    ], bands))}
      ${UI.card('Median CTC by department', Chart.hbar(byDept, { fmt: (v, it) => `${fmtINR(v)} <span class="muted">/ ${it.n}</span>`, limit: 14 }))}
    </div>
    <div class="grid g2">
      ${UI.card('Increment reasons', Chart.donut(Object.entries(groupBy(hist, h => h.reason)).map(([k, v]) => ({ k, v: v.length })), { centerLabel: 'revisions' }))}
      ${UI.card('Recent salary revisions', UI.table([
      { h: 'Employee', f: h => { const e = DB.byId[h.empId]; return e ? esc(e.name) : h.empId; } },
      { h: 'Effective', f: h => fmtDate(h.date) },
      { h: 'From', r: 1, f: h => UI.money(h.from * 12, h.empId) },
      { h: 'To', r: 1, f: h => UI.money(h.to * 12, h.empId) },
      { h: 'Increase', r: 1, f: h => `<span class="tag pos">${fmtP(h.pct)}</span>` },
      { h: 'Reason', f: h => esc(h.reason) }
    ], hist.slice().sort((a, b) => b.date - a.date), { limit: 120, onRow: h => `App.openEmployee('${h.empId}')` }), { actions: UI.toolbar('salaryHistory') })}
    </div>`;
};

function employeeContribution(e) {
  const rep = DB.sales.reps.find(r => r.empId === e.id);
  if (rep) return `<div class="grid g4">
    ${UI.kpi('Revenue', fmtINR(rep.revenue), {})}${UI.kpi('Target', fmtINR(rep.target), {})}
    ${UI.kpi('Achievement', fmtP(rep.ach), { bar: rep.ach })}${UI.kpi('Rank', '#' + rep.rank, { foot: `of ${DB.sales.reps.length} sellers` })}
    ${UI.kpi('Deals won', fmtN(rep.deals), {})}${UI.kpi('Average deal', fmtINR(rep.avgDeal), {})}
    ${UI.kpi('Conversion', fmtP(rep.conv), {})}${UI.kpi('Collection', fmtINR(rep.collection), {})}</div>`;
  const cs = DB.cs.agents.find(a => a.empId === e.id);
  if (cs) return `<div class="grid g4">
    ${UI.kpi('Accounts managed', fmtN(cs.accounts), {})}${UI.kpi('Retained', fmtN(cs.retained), { bar: pct(cs.retained, cs.accounts || 1) })}
    ${UI.kpi('CSAT', round(cs.csat, 2), {})}${UI.kpi('Upsell', fmtINR(cs.upsell), {})}
    ${UI.kpi('Tickets handled', fmtN(cs.tickets), {})}${UI.kpi('Resolution', round(cs.resolution, 1) + ' h', {})}
    ${UI.kpi('Renewals due', fmtN(cs.renewals), {})}</div>`;
  const mk = DB.marketing.people.find(p => p.empId === e.id);
  if (mk) return `<div class="grid g4">
    ${UI.kpi('Campaigns', fmtN(mk.campaigns), {})}${UI.kpi('Spend managed', fmtINR(mk.spend), {})}
    ${UI.kpi('Leads', fmtN(mk.leads), {})}${UI.kpi('Customers', fmtN(mk.customers), {})}
    ${UI.kpi('Revenue', fmtINR(mk.revenue), {})}${UI.kpi('ROI', fmtP(mk.roi), {})}</div>`;
  const bu = DB.procurement.buyers.find(b => b.empId === e.id);
  if (bu) return `<div class="grid g4">
    ${UI.kpi('Purchase orders', fmtN(bu.pos), {})}${UI.kpi('Value handled', fmtINR(bu.value), {})}
    ${UI.kpi('Saving', fmtINR(bu.saving), {})}${UI.kpi('Cycle time', round(bu.cycle, 1) + ' d', {})}
    ${UI.kpi('Delayed orders', fmtN(bu.delayed), {})}</div>`;
  const itp = DB.it.people.find(p => p.empId === e.id);
  if (itp) return `<div class="grid g4">
    ${UI.kpi('Tickets closed', fmtN(itp.closed), {})}${UI.kpi('SLA', fmtP(itp.sla), { bar: itp.sla })}
    ${UI.kpi('Resolution time', round(itp.mttr, 1) + ' h', {})}${UI.kpi('Projects', fmtN(itp.projects), {})}
    ${UI.kpi('Reopened tickets', fmtN(itp.reopened), {})}</div>`;
  const op = DB.operations.people.find(p => p.empId === e.id);
  if (op) return `<div class="grid g4">
    ${UI.kpi('Output', fmtN(op.output), {})}${UI.kpi('Target', fmtN(op.target), {})}
    ${UI.kpi('Efficiency', fmtP(op.efficiency), { bar: op.efficiency })}${UI.kpi('SLA', fmtP(op.sla), {})}
    ${UI.kpi('Errors', fmtN(op.errors), {})}${UI.kpi('Cost saved', fmtINR(op.saving), {})}</div>`;
  /* fallback: generic contribution from attendance, payroll and performance */
  const att = DB.attendance.filter(a => a.empId === e.id && Ctx.mIdx().has(a.mi));
  const perf = DB.performance.filter(p => p.empId === e.id);
  const latest = perf[perf.length - 1];
  const cost = sum(DB.payroll.filter(p => p.empId === e.id && Ctx.mIdx().has(p.mi)), p => p.employerCost);
  return `<div class="grid g4">
    ${UI.kpi('Productive days', fmtN(sum(att, a => a.present)), { foot: `${fmtN(sum(att, a => a.ot))} overtime hours` })}
    ${UI.kpi('Cost to company (window)', Access.canSeeSalary(e.id) ? fmtINR(cost) : '•••', {})}
    ${UI.kpi('KPI achievement', latest ? fmtP(latest.kpiAch) : '—', { bar: latest ? latest.kpiAch : 0 })}
    ${UI.kpi('Goals met', latest ? `${latest.goalsMet} / ${latest.goals}` : '—', {})}</div>
    <p class="muted" style="font-size:12.5px;margin-top:12px">${esc(e.dept)} contribution is measured on delivery against plan rather than revenue. Department-level output sits in the ${esc(e.dept)} command centre.</p>`;
}


/* per-employee monthly salary ledger used inside Employee 360 */
function monthlySalaryStrip(e, pay) {
  if (!pay.length) return `<div class="empty"><div class="t">No payroll months in this window</div>Widen the period filter above.</div>`;
  const rows = pay.slice().sort((a, b) => a.mi - b.mi).map((p, i, arr) => {
    const prev = arr[i - 1];
    return { ...p, key: DB.months[p.mi].key, mom: prev ? pct(p.gross - prev.gross, prev.gross || 1) : 0 };
  });
  const chart = Chart.line({
    labels: rows.map(r => r.key), fmt: 'inr', height: 190,
    series: [{ name: 'Gross', values: rows.map(r => r.gross) },
    { name: 'Net paid', values: rows.map(r => r.net), color: 'var(--s2)' },
    { name: 'Employer cost', values: rows.map(r => r.employerCost), color: 'var(--s3)' }]
  });
  return chart + '<div style="height:10px"></div>' + UI.table([
    { h: 'Month', f: r => `<b>${esc(r.key)}</b>` },
    { h: 'Gross', r: 1, f: r => fmtINR(r.gross) },
    { h: 'PF', r: 1, f: r => fmtINR(r.pf) },
    { h: 'ESIC', r: 1, f: r => fmtINR(r.esic) },
    { h: 'PT', r: 1, f: r => fmtINR(r.pt) },
    { h: 'TDS', r: 1, f: r => fmtINR(r.tds) },
    { h: 'Net paid', r: 1, f: r => `<b>${fmtINR(r.net)}</b>` },
    { h: 'OT hours', r: 1, f: r => fmtN(r.otHours) },
    { h: 'OT pay', r: 1, f: r => fmtINR(r.otPay) },
    { h: 'Employer cost', r: 1, f: r => fmtINR(r.employerCost) },
    { h: 'MoM', r: 1, f: r => r.mom ? `<span class="delta ${r.mom > .05 ? 'up' : r.mom < -.05 ? 'down' : 'flat'}">${fmtP(r.mom)}</span>` : '—' }
  ], rows);
}

/* per-employee monthly KPI ledger used inside Employee 360 */
function monthlyPerfStrip(e) {
  const rows = DB.empMonthly.filter(x => x.empId === e.id && Ctx.mIdx().has(x.mi)).sort((a, b) => a.mi - b.mi);
  if (!rows.length) return `<div class="empty"><div class="t">No monthly KPI records in this window</div>This employee joined after the period selected above.</div>`;
  const metric = rows[0].metric, money = rows[0].money;
  const chart = Chart.bars({
    labels: rows.map(r => r.monthKey), fmt: money ? 'inr' : undefined, height: 190,
    series: [{ name: 'Actual', values: rows.map(r => r.actual) },
    { name: 'Target', values: rows.map(r => r.target), color: 'var(--ink-3)', faded: true }]
  });
  const best = rows.slice().sort(byDesc('ach'))[0], worst = rows.slice().sort((a, b) => a.ach - b.ach)[0];
  const summary = `<div class="grid g4" style="margin-bottom:12px">
    ${UI.kpi('KPI measured', esc(metric), { foot: money ? 'value delivered' : esc(rows[0].unit) })}
    ${UI.kpi('Window achievement', fmtP(pct(sum(rows, r => r.actual), sum(rows, r => r.target) || 1)), { bar: pct(sum(rows, r => r.actual), sum(rows, r => r.target) || 1) })}
    ${UI.kpi('Best month', fmtP(best.ach), { foot: esc(best.monthKey), color: 'var(--pos)' })}
    ${UI.kpi('Weakest month', fmtP(worst.ach), { foot: esc(worst.monthKey), color: worst.ach < 80 ? 'var(--neg)' : '' })}
  </div>`;
  const cols = [
    { h: 'Month', f: r => `<b>${esc(r.monthKey)}</b>` },
    { h: 'Target', r: 1, f: r => r.money ? fmtINR(r.target) : fmtN(r.target) },
    { h: 'Actual', r: 1, f: r => r.money ? fmtINR(r.actual) : fmtN(r.actual) },
    { h: 'Achievement', r: 1, f: r => achCell(r.ach) },
    { h: 'Attendance', r: 1, f: r => fmtP(r.attendancePct) },
    { h: 'Quality', r: 1, f: r => fmtP(r.quality) },
    { h: 'Score', r: 1, f: r => `<span class="tag ${r.score >= 80 ? 'pos' : r.score >= 65 ? '' : r.score >= 50 ? 'warn' : 'neg'}">${round(r.score, 0)}</span>` },
    { h: 'Monthly rating', r: 1, f: r => round(r.rating, 1) }
  ];
  if (rows[0].secondaryLabel) cols.splice(3, 0, {
    h: rows[0].secondaryLabel, r: 1,
    f: r => r.secondaryValue === '' ? '—' : (r.secondaryLabel === 'Saving' ? fmtINR(r.secondaryValue) : fmtN(r.secondaryValue, r.secondaryLabel === 'CSAT' ? 2 : 0))
  });
  return summary + chart + '<div style="height:10px"></div>' + UI.table(cols, rows);
}

/* ------------------------------------------------- MONTHLY SALARY REGISTER */
function monthlySalaryBody() {
  const s = Agg.payrollMonthly();
  const months = s.months;
  if (!s.people.length) return `<div class="empty"><div class="t">No payroll records in this scope</div>Widen the department filter or the period.</div>`;
  const aggregateOnly = !['SUPER_ADMIN', 'HR_ADMIN', 'FINANCE_ADMIN'].includes(State.user.role);
  const mode = App.tabOf('salaryMode', 'gross');
  const field = mode === 'net' ? 'net' : mode === 'cost' ? 'employerCost' : 'gross';
  const fieldLabel = mode === 'net' ? 'Net paid' : mode === 'cost' ? 'Employer cost' : 'Gross';

  const monthCols = months.map(m => ({
    h: m.key, r: 1, f: p => {
      const row = p.series[months.indexOf(months.find(x => x.key === m.key))];
      if (!row) return '<span class="muted">—</span>';
      if (!Access.canSeeSalary(p.e.id)) return '<span class="muted">•••</span>';
      const idx = months.findIndex(x => x.key === m.key);
      const prev = idx > 0 ? p.series[idx - 1] : null;
      const ch = prev ? pct(row[field] - prev[field], prev[field] || 1) : 0;
      const tone = ch > 1.5 ? 'color:var(--pos)' : ch < -1.5 ? 'color:var(--neg)' : '';
      return `<span style="${tone}" title="${prev ? fmtP(ch) + ' against ' + prev.mi : 'first month in window'}">${fmtINR(row[field])}</span>`;
    }
  }));

  return `<div class="grid g4" style="margin-bottom:14px">
      ${UI.kpi(`${esc(s.current.key || '—')} employer cost`, fmtINR(s.current.employerCost || 0), { delta: s.mom, foot: `${fmtN(s.current.headcount || 0)} on payroll` })}
      ${UI.kpi('Previous month', fmtINR(s.previous.employerCost || 0), { foot: esc(s.previous.key || '—') })}
      ${UI.kpi('Month-on-month change', fmtINR((s.current.employerCost || 0) - (s.previous.employerCost || 0)), { color: s.mom > 0 ? 'var(--warn)' : 'var(--pos)', foot: fmtP(s.mom) + ' movement' })}
      ${UI.kpi('Peak month', fmtINR(s.peak.employerCost || 0), { foot: esc(s.peak.key || '—') })}
      ${UI.kpi('Window total', fmtINR(s.total), { foot: `${months.length} months · gross ${fmtINR(s.totalGross)}` })}
      ${UI.kpi('Net paid', fmtINR(s.totalNet), { foot: `deductions ${fmtINR(s.totalGross - s.totalNet)}` })}
      ${UI.kpi('Overtime paid', fmtINR(s.totalOt), { foot: 'included in gross' })}
      ${UI.kpi('Salary revisions', fmtN(s.revisions.length), { foot: s.revisions.length ? `annualised impact ${fmtINR(s.revisionCost)}` : 'none inside this window' })}
    </div>

    <div class="grid g23" style="margin-bottom:14px">
      ${UI.card('Payroll cost month on month', Chart.bars({
    labels: s.monthly.map(m => m.key), fmt: 'inr',
    series: [{ name: 'Employer cost', values: s.monthly.map(m => m.employerCost) },
    { name: 'Net paid', values: s.monthly.map(m => m.net), color: 'var(--s2)' }]
  }), { sub: 'bars are the company cost, not take-home' })}
      ${UI.card('Movement', `<div class="hcomp">
        ${s.monthly.map(m => `<div class="hrow" title="${esc(m.key)}">
          <span class="n">${esc(m.key)}</span>
          <span class="bar-mini"><i style="width:${clamp(Math.abs(m.mom) * 8, 2, 100)}%;background:${m.mom > 0 ? 'var(--warn)' : m.mom < 0 ? 'var(--pos)' : 'var(--line)'}"></i></span>
          <span class="v" style="${m.mom > 0 ? 'color:var(--warn)' : m.mom < 0 ? 'color:var(--pos)' : ''}">${m.mom ? fmtP(m.mom) : '—'}</span></div>`).join('')}
      </div><p class="muted" style="font-size:12px;margin-top:12px">Movement is driven by joiners, exits, overtime and revisions — the headcount column in the table below tells you which.</p>`)}
    </div>

    ${UI.card('Company payroll by month', UI.table([
    { h: 'Month', f: m => `<b>${esc(m.key)}</b>` },    { h: 'On payroll', r: 1, f: m => `${fmtN(m.headcount)}${m.headcountDelta ? ` <span class="muted">(${m.headcountDelta > 0 ? '+' : ''}${m.headcountDelta})</span>` : ''}` },
    { h: 'Gross', r: 1, f: m => fmtINR(m.gross) },
    { h: 'PF', r: 1, f: m => fmtINR(m.pf) },
    { h: 'ESIC', r: 1, f: m => fmtINR(m.esic) },
    { h: 'PT', r: 1, f: m => fmtINR(m.pt) },
    { h: 'TDS', r: 1, f: m => fmtINR(m.tds) },
    { h: 'Net paid', r: 1, f: m => fmtINR(m.net) },
    { h: 'Overtime', r: 1, f: m => fmtINR(m.otPay) },
    { h: 'Employer cost', r: 1, f: m => `<b>${fmtINR(m.employerCost)}</b>` },
    { h: 'MoM', r: 1, f: m => m.mom ? `<span class="delta ${m.mom > .05 ? 'up' : m.mom < -.05 ? 'down' : 'flat'}">${fmtP(m.mom)}</span>` : '—' }
  ], s.monthly), { actions: UI.toolbar('payrollMonthlyCompany') })}

    <div style="height:14px"></div>
    ${aggregateOnly ? `<div class="demo-banner" style="background:var(--brand-soft);border-color:#CBD6F7;color:var(--brand-deep)">Individual salary is masked for your role. Company totals above are complete.</div>` : ''}
    ${UI.card('Employee salary, month by month', UI.table([
    { h: 'Employee', f: p => UI.empName(p.e) },
    { h: 'Department', f: p => esc(p.e.dept) },
    ...monthCols,
    { h: 'Window total', r: 1, f: p => Access.canSeeSalary(p.e.id) ? `<b>${fmtINR(p[field])}</b>` : '<span class="muted">•••</span>' },
    { h: 'Last MoM', r: 1, f: p => !Access.canSeeSalary(p.e.id) ? '<span class="muted">•••</span>' : (p.mom ? `<span class="delta ${p.mom > .05 ? 'up' : p.mom < -.05 ? 'down' : 'flat'}">${fmtP(p.mom)}</span>` : '—') },
    { h: 'Revisions', r: 1, f: p => p.revisions.length ? `<span class="tag pos">${p.revisions.length}</span>` : '—' }
  ], s.people, { onRow: p => `App.openEmployee('${p.e.id}')`, limit: 150 }), {
    sub: `showing ${fieldLabel.toLowerCase()} — click a row for the full record`,
    actions: `<button class="btn btn-sm ${mode === 'gross' ? 'btn-primary' : ''}" onclick="App.tab('salaryMode','gross')">Gross</button>
              <button class="btn btn-sm ${mode === 'net' ? 'btn-primary' : ''}" onclick="App.tab('salaryMode','net')">Net</button>
              <button class="btn btn-sm ${mode === 'cost' ? 'btn-primary' : ''}" onclick="App.tab('salaryMode','cost')">Employer cost</button>
              ${UI.toolbar('payrollMonthly')}`
  })}

    <div style="height:14px"></div>
    ${UI.card('Salary revisions inside this window', UI.table([
    { h: 'Employee', f: h => { const e = DB.byId[h.empId]; return e ? esc(e.name) : h.empId; } },
    { h: 'Department', f: h => esc((DB.byId[h.empId] || {}).dept || '') },
    { h: 'Effective', f: h => fmtDate(h.date) },
    { h: 'From (monthly)', r: 1, f: h => UI.money(h.from, h.empId) },
    { h: 'To (monthly)', r: 1, f: h => UI.money(h.to, h.empId) },
    { h: 'Increase', r: 1, f: h => `<span class="tag pos">${fmtP(h.pct)}</span>` },
    { h: 'Annual impact', r: 1, f: h => UI.money((h.to - h.from) * 12, h.empId) },
    { h: 'Reason', f: h => esc(h.reason) }
  ], s.revisions.slice().sort((a, b) => b.date - a.date), {
    emptyTitle: 'No salary revisions in this window',
    emptyBody: 'Widen the period to 12 months to pick up the last increment cycle.'
  }), { actions: UI.toolbar('salaryHistory') })}`;
}

function achCell(v) {
  if (v == null) return '<span class="muted">—</span>';
  const tone = v >= 100 ? 'pos' : v >= 85 ? '' : v >= 70 ? 'warn' : 'neg';
  return `<span class="tag ${tone}">${round(v, 0)}%</span>`;
}

function monthlyPerfBody() {
  const p = Agg.employeeMonthly();
  if (!p.people.length) return `<div class="empty"><div class="t">No monthly records in this scope</div>Clear the department filter or widen the period.</div>`;
  const months = p.months;
  const mode = App.tabOf('perfMode', 'ach');

  const monthCols = months.map((m, idx) => ({
    h: m.key, r: 1, f: row => {
      const cell = row.series[idx];
      if (!cell) return '<span class="muted">—</span>';
      if (mode === 'ach') return `<span title="${esc(cell.metric)}: ${cell.money ? fmtINR(cell.actual) : fmtN(cell.actual)} against ${cell.money ? fmtINR(cell.target) : fmtN(cell.target)}">${achCell(cell.ach)}</span>`;
      if (mode === 'score') return `<span class="tag ${cell.score >= 80 ? 'pos' : cell.score >= 65 ? '' : cell.score >= 50 ? 'warn' : 'neg'}">${round(cell.score, 0)}</span>`;
      return `<span title="target ${cell.money ? fmtINR(cell.target) : fmtN(cell.target)}">${cell.money ? fmtINR(cell.actual) : fmtN(cell.actual)}</span>`;
    }
  }));

  const deptSeries = p.byDept.slice(0, 6).map((d, i) => ({ name: d.k, values: d.series.map(v => v || 0), color: PAL[i % PAL.length] }));

  return `<div class="grid g4" style="margin-bottom:14px">
      ${UI.kpi(`${esc(p.current.key || '—')} achievement`, fmtP(p.current.ach || 0), { delta: p.momAch, bar: p.current.ach, foot: `${fmtN(p.current.headcount || 0)} employees measured` })}

      ${UI.kpi('Average score', round(p.avgScore, 1) + ' / 100', { bar: p.avgScore, foot: 'achievement, attendance and quality combined' })}
      ${UI.kpi('At or above target', fmtN(p.current.above || 0), { foot: `in ${esc(p.current.key || '—')}`, color: 'var(--pos)' })}
      ${UI.kpi('Below 70%', fmtN(p.current.below || 0), { color: (p.current.below || 0) ? 'var(--neg)' : '', foot: 'needs a conversation this month' })}
      ${UI.kpi('Consistent performers', fmtN(p.consistent), { foot: 'hit target in every month of the window' })}
      ${UI.kpi('Employees tracked', fmtN(p.people.length), { foot: Ctx.deptFilter() ? esc(Ctx.deptFilter()) : 'across all departments' })}
    </div>

    <div class="grid g2" style="margin-bottom:14px">
      ${UI.card('Achievement month on month', Chart.line({
    labels: p.monthly.map(m => m.key), fmt: 'pct', min: 40,
    series: [{ name: 'All employees in scope', values: p.monthly.map(m => m.ach || 0), color: 'var(--s1)' }], area: true
  }), { sub: 'average of every employee KPI in scope' })}
      ${UI.card('Department comparison', deptSeries.length > 1
      ? Chart.line({ labels: months.map(m => m.key), fmt: 'pct', min: 40, series: deptSeries })
      : Chart.bars({ labels: p.monthly.map(m => m.key), fmt: 'pct', series: [{ name: 'Achievement', values: p.monthly.map(m => m.ach || 0) }] }),
      { sub: deptSeries.length > 1 ? 'top departments by achievement' : 'single department in scope' })}
    </div>

    <div class="grid g2" style="margin-bottom:14px">
      ${UI.card('Improving', p.improving.length ? UI.table([
        { h: 'Employee', f: r => UI.empName(r.e) },
        { h: 'Department', f: r => esc(r.dept) },
        { h: 'Latest', r: 1, f: r => achCell(r.last ? r.last.ach : null) },
        { h: 'Trend', r: 1, f: r => `<span class="delta up">▲ ${fmtP(Math.abs(r.trend))}</span>` }
      ], p.improving, { onRow: r => `App.openEmployee('${r.id}')` })
    : `<div class="empty"><div class="t">No clear improvers yet</div>Second half of the window is level with the first.</div>`,
    { sub: 'second half of the window against the first' })}
      ${UI.card('Slipping', p.declining.length ? UI.table([
      { h: 'Employee', f: r => UI.empName(r.e) },
      { h: 'Department', f: r => esc(r.dept) },
      { h: 'Latest', r: 1, f: r => achCell(r.last ? r.last.ach : null) },
      { h: 'Trend', r: 1, f: r => `<span class="delta down">▼ ${fmtP(Math.abs(r.trend))}</span>` }
    ], p.declining, { onRow: r => `App.openEmployee('${r.id}')` })
      : `<div class="empty"><div class="t">Nobody is slipping</div>No employee in scope has lost more than 2 points across the window.</div>`,
      { sub: 'worth a conversation before the next review' })}
    </div>

    ${UI.card('Department achievement by month', UI.table([
      { h: 'Department', f: d => `<b>${esc(d.k)}</b>` },
      ...months.map((m, i) => ({ h: m.key, r: 1, f: d => achCell(d.series[i]) })),
      { h: 'Average', r: 1, f: d => `<b>${fmtP(d.v)}</b>` },

    <div style="height:14px"></div>
    ${UI.card('Employee performance, month by month', UI.table([
      { h: 'Employee', f: r => UI.empName(r.e) },
      { h: 'Department', f: r => esc(r.dept) },
      { h: 'KPI measured', f: r => `${esc(r.metric)}<br><span class="muted" style="font-size:11px">${r.money ? 'value' : esc(r.unit)}</span>` },

      { h: 'Last MoM', r: 1, f: r => r.delta ? `<span class="delta ${r.delta > .5 ? 'up' : r.delta < -.5 ? 'down' : 'flat'}">${fmtP(Math.abs(r.delta))}</span>` : '—' }
    ], p.people, { onRow: r => `App.openEmployee('${r.id}')`, limit: 150 }), {
      sub: 'every department gets the KPI that fits it — revenue for sellers, tickets for support, units for the floor',

                <button class="btn btn-sm ${mode === 'score' ? 'btn-primary' : ''}" onclick="App.tab('perfMode','score')">Score</button>
                ${UI.toolbar('perfMonthly')}`
    })}`;
}

const Config = {
  apiUrl: null,                      /* e.g. 'https://script.google.com/macros/s/…/exec' */
  contactEmail: 'teamwork.hrsolution@zohomail.in',   /* never rendered as text */
  contactPhone: '919518842774'                       /* never rendered as text */
};

const Data = {
  mode() { return Config.apiUrl ? 'sheets' : 'local'; },
  async fetch(scn) {
    if (Config.apiUrl) {
      try {
        const res = await fetch(`${Config.apiUrl}?action=dataset&biz=${encodeURIComponent(scn.biz)}&industry=${encodeURIComponent(scn.industry)}&size=${encodeURIComponent(scn.size)}&location=${encodeURIComponent(scn.location)}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        if (!json || !json.employees) throw new Error('Unexpected payload');
        return { db: hydrate(json), source: 'Google Sheets backend' };
      } catch (err) {
        console.warn('Sheets backend unavailable, falling back to the local dataset:', err);
        return { db: Gen.build(scn), source: 'local synthetic dataset (backend unreachable)', degraded: true };
      }
    }
    return { db: Gen.build(scn), source: 'local synthetic dataset' };
  }
};
/* revive dates coming back as ISO strings from a JSON backend */
function hydrate(json) {
  const fix = o => { ['doj', 'dol', 'date', 'due', 'since', 'openedDate', 'generatedAt'].forEach(k => { if (o && typeof o[k] === 'string') o[k] = new Date(o[k]); }); return o; };
  const walk = v => { if (Array.isArray(v)) v.forEach(walk); else if (v && typeof v === 'object') { fix(v); Object.values(v).forEach(walk); } };
  walk(json);
  json.byId = Object.fromEntries(json.employees.map(e => [e.id, e]));
  if (!json.users) json.users = [];
  json.months.forEach(m => m.date = new Date(m.date));
  return json;
}

    const res = [];
    App.availableDash().forEach(id => { if (DASH[id].label.toLowerCase().includes(q)) res.push({ t: DASH[id].label, k: 'Dashboard', go: `App.go('${id}')` }); });

  return `<div class="grid g4" style="margin-bottom:14px">${Array(8).fill(0).map(() => `<div class="kpi"><span class="skel" style="height:11px;width:60%"></span><span class="skel" style="height:22px;width:75%"></span><span class="skel" style="height:10px;width:45%"></span></div>`).join('')}</div>
    <div class="grid g2">${Array(2).fill(0).map(() => `<div class="card"><div class="card-b"><div class="loading-rows">${Array(7).fill('<i class="skel"></i>').join('')}</div></div></div>`).join('')}</div>`;

/* ============================== MODAL ================================== */
function modal(head, body, footer, wide) {
  closeModal();
  const el = document.createElement('div');
  el.className = 'overlay'; el.id = 'overlay';
  el.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
    <div class="modal-h">${head}</div><div class="modal-b">${body}</div><div class="modal-f">${footer}</div></div>`;
  el.addEventListener('click', e => { if (e.target === el) closeModal(); });
  document.body.appendChild(el);
  Chart.hydrate(el);
}
function closeModal() { const el = $('#overlay'); if (el) el.remove(); Chart.hide(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); App.closeSearch && App.closeSearch(); } });

/* ============================ CONTACT CTA ============================== */
function requirementLines() {
  const d = DASH[State.dash] ? DASH[State.dash].label : 'Dashboard selection';
  return [
    `Business Type: ${BUSINESS[State.scn.biz].label}`,
    `Industry: ${State.scn.industry}`,
    `Company Size: ${SIZES.find(s => s.id === State.scn.size).label}`,
    `Location: ${State.scn.location}`,
    `Department: ${Ctx.deptFilter() || 'All departments'}`,
    `Dashboard: ${d}`
  ];
}
const Contact = {
  subject() {
    const d = DASH[State.dash] ? DASH[State.dash].label : 'Dashboard';
    return `Dashboard Requirement — ${BUSINESS[State.scn.biz].label.split(' /')[0]} / ${State.scn.industry} / ${d}`;
  },
  body(channel) {
    return `Hello HRToolKit India,\n\nI am interested in a customised business dashboard.\n\nMy requirement:\n\n${requirementLines().join('\n')}\n\nPlease contact me to discuss customisation options.\n\nRegards`;
  },
  email() {
    audit('Contact — email', requirementLines().join(' | '));
    const href = `mailto:${Config.contactEmail}?subject=${encodeURIComponent(Contact.subject())}&body=${encodeURIComponent(Contact.body())}`;
    Contact.lastLink = href;
    /* an anchor click works inside the Apps Script iframe, where assigning
       window.location is blocked by the sandbox */
    const a = document.createElement('a');
    a.href = href; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Opening your email app with the requirement filled in');
  },
  whatsapp() {
    audit('Contact — WhatsApp', requirementLines().join(' | '));
    const href = `https://wa.me/${Config.contactPhone}?text=${encodeURIComponent(Contact.body())}`;
    Contact.lastLink = href;
    const w = window.open(href, '_blank', 'noopener');
    if (!w) { const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
    toast('Opening WhatsApp with your requirement filled in');
  },
  preview() {
    modal(`<h2>What we will send</h2><p class="muted" style="font-size:13px">Built from what you selected — you do not have to explain your requirement twice.</p>`,
      `<div class="field"><label>Subject</label><input value="${esc(Contact.subject())}" readonly /></div>
       <div class="field"><label>Message</label><textarea readonly style="min-height:180px">${esc(Contact.body())}</textarea></div>`,
      `<button class="btn" onclick="closeModal()">Close</button>
       <button class="btn btn-wa" onclick="closeModal();Contact.whatsapp()">Send on WhatsApp</button>
       <button class="btn btn-primary" onclick="closeModal();Contact.email()">Send by email</button>`);
  }
};
function ctaBlock() {
  return `<section class="cta">
    <div>
      <h2>Want this dashboard for your business?</h2>
      <p>We build HR, payroll, employee analytics, business intelligence and department performance dashboards around how your
         organisation actually runs — your data, your departments, your access rules.</p>
      <div class="req">Your message will already say: ${esc(requirementLines().slice(0, 4).join(' · '))} · ${esc(DASH[State.dash] ? DASH[State.dash].label : '')}</div>
    </div>
    <div class="btns">
      <button class="btn btn-primary" onclick="Contact.email()">✉ Build my dashboard</button>
      <button class="btn btn-wa" onclick="Contact.whatsapp()">💬 Chat on WhatsApp</button>
      <button class="btn btn-ghost" style="color:#9FB0C6" onclick="Contact.preview()">Preview message</button>
    </div></section>`;
}

/* =============================== EXPORT ================================ */
const Export = {
  sets() {
