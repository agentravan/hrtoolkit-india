      }),
      performance: () => ({
        name: 'performance', rows: DB.performance.filter(x => Ctx.empIds(true).has(x.empId) && (!Ctx.deptFilter() || x.dept === Ctx.deptFilter()))
          .map(x => ({ EmployeeID: x.empId, Name: (DB.byId[x.empId] || {}).name || '', Department: x.dept, Cycle: x.cycle, Rating: x.rating, KPIAchievement: x.kpiAch, Goals: x.goals, GoalsMet: x.goalsMet, Feedback: x.feedback }))
      }),
      recruitment: () => ({ name: 'recruitment', rows: Agg.recruitment().rows.map(r => ({ RequisitionID: r.id, Position: r.position, Department: r.dept, Opened: fmtDate(r.openedDate), Source: r.source, Candidates: r.candidates, Screened: r.screened, Shortlisted: r.shortlisted, Interviewed: r.interviewed, Offers: r.offers, Joined: r.joined, DaysToHire: r.ttf, Cost: r.cost, Status: r.status })) }),
      exits: () => ({ name: 'attrition', rows: Agg.people().exitRows.map(x => ({ EmployeeID: x.empId, Name: x.name, Department: x.dept, ExitDate: fmtDate(x.date), TenureYears: x.tenure, Type: x.voluntary ? 'Voluntary' : 'Involuntary', Reason: x.reason, Regrettable: x.regrettable ? 'Yes' : 'No', Manager: (DB.byId[x.managerId] || {}).name || '' })) }),
      salesReps: () => ({ name: 'sales-performance', rows: Agg.sales().reps.map(r => ({ Rank: r.rank, EmployeeID: r.empId, Name: r.name, Revenue: r.revenue, Target: r.target, AchievementPct: r.ach, Deals: r.deals, AvgDeal: r.avgDeal, ConversionPct: r.conv, Customers: r.customers, Collection: r.collection })) }),
      finance: () => ({ name: 'finance', rows: Agg.finance().monthly.map(m => ({ Month: m.key, Revenue: m.revenue, Target: m.target, Profit: m.profit, Cash: m.cash, Collections: m.collections })) }),
      budget: () => ({ name: 'budget-variance', rows: Agg.finance().budget.map(b => ({ Department: b.dept, Budget: b.budget, Actual: b.actual, Payroll: b.payroll, Other: b.other, Variance: b.variance, VariancePct: round(b.variancePct, 1) })) }),
      campaigns: () => ({ name: 'marketing-campaigns', rows: Agg.marketing().campaigns.map(c => ({ CampaignID: c.id, Name: c.name, Channel: c.channel, Spend: c.spend, Leads: c.leads, CostPerLead: c.cpl, Customers: c.customers, ConversionPct: c.conv, Revenue: c.revenue, ROIPct: c.roi, Status: c.status })) }),
      customers: () => ({ name: 'customers', rows: Agg.cs().top.concat(DB.customers.filter(c => c.status === 'Churned')).map(c => ({ CustomerID: c.id, Name: c.name, Segment: c.segment, ARR: c.arr, Status: c.status, CSAT: c.csat, NPS: c.nps, Tickets: c.tickets, CustomerSince: fmtDate(c.since), Owner: (DB.byId[c.owner] || {}).name || '' })) }),
      opsPeople: () => ({ name: 'operations-performance', rows: Agg.operations().people.map(r => ({ EmployeeID: r.empId, Name: r.name, Output: r.output, Target: r.target, EfficiencyPct: r.efficiency, SLAPct: r.sla, Errors: r.errors, CostSaved: r.saving })) }),
      itPeople: () => ({ name: 'it-performance', rows: Agg.it().people.map(r => ({ EmployeeID: r.empId, Name: r.name, TicketsClosed: r.closed, SLAPct: r.sla, MTTRHours: r.mttr, Reopened: r.reopened, Incidents: r.incidents, Projects: r.projects })) }),
      pos: () => ({ name: 'purchase-orders', rows: Agg.procurement().pos.map(x => ({ PO: x.id, Vendor: x.vendor, Month: DB.months[x.mi].key, Quoted: x.quoted, FinalValue: x.value, Saving: x.saving, CycleDays: x.cycle, Delayed: x.delayed ? 'Yes' : 'No', Status: x.status })) }),
      vendors: () => ({ name: 'vendor-performance', rows: Agg.procurement().vendors.map(v => ({ VendorID: v.id, Name: v.name, Category: v.category, Orders: v.orders, Spend: v.spend, OnTimePct: v.onTime, QualityPct: v.quality, Score: v.score })) }),
      production: () => ({ name: 'production', rows: (Agg.production() || { monthly: [] }).monthly.map(m => ({ Month: m.key, Target: m.target, Actual: m.actual, AchievementPct: round(pct(m.actual, m.target), 1), OEE: m.oee, QualityPct: m.qual, Rejected: m.rejected })) }),
      machines: () => ({ name: 'maintenance', rows: (Agg.maintenance() || { list: [] }).list.map(m => ({ MachineID: m.id, Name: m.name, Line: m.line, Breakdowns: m.breakdowns, DowntimeHours: m.downtime, MTBF: m.mtbf, MTTR: m.mttr, PMDone: m.pmDone, PMDue: m.pmDue ? 'Yes' : 'No', Condition: m.condition })) }),
      incidents: () => ({ name: 'safety-incidents', rows: (Agg.safety() || { list: [] }).list.map(i => ({ Month: DB.months[i.mi].key, Type: i.type, Area: i.area, Severity: i.severity, DaysLost: i.lost })) }),
      inventory: () => ({ name: 'inventory', rows: (Agg.inventory() || { items: [] }).items.map(i => ({ SKU: i.id, Item: i.name, Category: i.cat, Quantity: i.qty, UOM: i.uom, Value: i.value, CoverDays: i.days, AgeingDays: i.aging, BelowReorder: i.reorder ? 'Yes' : 'No' })) }),
      suppliers: () => ({ name: 'supply-chain', rows: (Agg.supplychain() || { list: [] }).list.map(s => ({ Supplier: s.name, Spend: s.spend, OnTimePct: s.onTime, LeadTimeDays: s.leadTime, RejectionPct: s.rejectionPct, Delays: s.delays })) }),
      compliance: () => ({ name: 'compliance', rows: Agg.compliance().rows.map(c => ({ ID: c.id, Item: c.item, Category: c.category, Frequency: c.frequency, Owner: c.owner, DueDate: fmtDate(c.due), Risk: c.risk, Status: c.status })) }),
      employee360: () => {
        const id = State.filters.empId;
        if (!id || !Access.canSeeEmployee(id)) return { name: 'employee-360', rows: [] };
        const e = DB.byId[id], ok = Access.canSeeSalary(id);
        const rows = [{ Section: 'Profile', Field: 'Employee ID', Value: e.id }, { Section: 'Profile', Field: 'Name', Value: e.name },
        { Section: 'Profile', Field: 'Department', Value: e.dept }, { Section: 'Profile', Field: 'Designation', Value: e.desig },
        { Section: 'Profile', Field: 'Manager', Value: (DB.byId[e.managerId] || {}).name || '' },
        { Section: 'Profile', Field: 'Joined', Value: fmtDate(e.doj) }, { Section: 'Profile', Field: 'Location', Value: e.site },
        { Section: 'Salary', Field: 'Annual CTC', Value: ok ? e.ctc : 'restricted' }];
        DB.attendance.filter(a => a.empId === id && Ctx.mIdx().has(a.mi)).forEach(a => rows.push({ Section: 'Attendance', Field: DB.months[a.mi].key, Value: `${a.present}/${a.workDays} present, ${a.ot} OT hours` }));
        DB.leave.filter(l => l.empId === id).forEach(l => rows.push({ Section: 'Leave', Field: l.type, Value: `${l.taken} taken, ${l.balance} balance` }));
        DB.performance.filter(p => p.empId === id).forEach(p => rows.push({ Section: 'Performance', Field: p.cycle, Value: `rating ${p.rating}, KPI ${p.kpiAch}%` }));
        DB.salaryHistory.filter(h => h.empId === id).forEach(h => rows.push({ Section: 'Salary history', Field: fmtDate(h.date), Value: ok ? `${h.from * 12} → ${h.to * 12} (${h.pct}%)` : `revision ${h.pct}%` }));
        return { name: 'employee-360-' + e.id, rows };
      },
      perfMonthly: () => ({
        name: 'monthly-performance',
        rows: Agg.employeeMonthly().rows.slice().sort(function (a, b) {
          return a.empId.localeCompare(b.empId) || a.mi - b.mi;
        }).map(function (r) {
          return {
            EmployeeID: r.empId, Name: (DB.byId[r.empId] || {}).name || '', Department: r.dept,
            Month: r.monthKey, KPI: r.metric, Unit: r.money ? 'INR' : r.unit,
            Target: r.target, Actual: r.actual, AchievementPct: r.ach,
            AttendancePct: r.attendancePct, QualityPct: r.quality,
            Score: r.score, MonthlyRating: r.rating,
            SecondaryMetric: r.secondaryLabel, SecondaryValue: r.secondaryValue
          };
        })
      }),
      perfMonthlyDept: () => {
        const p = Agg.employeeMonthly();
        return {
          name: 'monthly-performance-by-department',
          rows: p.byDept.map(function (d) {
            const row = { Department: d.k };
            p.months.forEach(function (m, i) { row[m.key] = d.series[i]; });
            row.WindowAverage = d.v; row.Score = d.score;
            return row;
          })
        };
      },
      payrollMonthly: () => {
        const s = Agg.payrollMonthly();
        const rows = [];
        s.people.forEach(function (p) {
          const ok = Access.canSeeSalary(p.e.id);
          p.series.forEach(function (m, i) {
            if (!m) return;
            rows.push({
              EmployeeID: p.e.id, Name: p.e.name, Department: p.e.dept, Band: p.e.band,
              Month: s.months[i].key,
              Gross: ok ? m.gross : 'restricted', PF: ok ? m.pf : '', ESIC: ok ? m.esic : '',
              PT: ok ? m.pt : '', TDS: ok ? m.tds : '', Net: ok ? m.net : '',
              OvertimeHours: m.otHours, OvertimePay: ok ? m.otPay : '',
              EmployerCost: ok ? m.employerCost : ''
            });
          });
        });
        return { name: 'monthly-salary', rows: rows };
      },
      payrollMonthlyCompany: () => ({
        name: 'monthly-payroll-summary',
        rows: Agg.payrollMonthly().monthly.map(function (m) {
          return {
            Month: m.key, OnPayroll: m.headcount, HeadcountChange: m.headcountDelta,
            Gross: m.gross, PF: m.pf, ESIC: m.esic, PT: m.pt, TDS: m.tds,
            Deductions: m.deductions, NetPaid: m.net, OvertimePay: m.otPay,
            EmployerCost: m.employerCost, MoMPct: round(m.mom, 2), AverageGross: round(m.avgGross, 0)
          };
        })
      }),
      monthlysalary: () => Export.sets().payrollMonthly(),
      monthlyperf: () => Export.sets().perfMonthly(),
      audit: () => ({ name: 'audit-log', rows: State.audit.map(a => ({ Time: a.ts.toISOString(), User: a.user, Role: ROLES[a.role] ? ROLES[a.role].label : a.role, Action: a.action, Detail: a.detail })) })
    };
  },
  run(key) {
    const set = Export.sets()[key];
    if (!set) { toast('That report is not available here', true); return; }
    const data = set();
    if (!data.rows.length) { toast('Nothing to export in the current scope', true); return; }
    const cols = Object.keys(data.rows[0]);
    const meta = [
      `HRToolKit India — HR Operations Intelligence Dashboard (demo, synthetic data)`,
      `Report,${data.name}`,
      `Business type,${BUSINESS[State.scn.biz].label}`,
      `Industry,${State.scn.industry}`,
      `Company size,${SIZES.find(s => s.id === State.scn.size).label}`,
      `Location,${State.scn.location}`,
      `Scope,${Ctx.label()}`,
      `Generated by,${State.user.name} (${ROLES[State.user.role].label})`,
      `Generated at,${new Date().toLocaleString('en-IN')}`, ''
    ].join('\n');
    const csv = meta + cols.join(',') + '\n' + data.rows.map(r => cols.map(c => {
      const v = r[c] == null ? '' : String(r[c]);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(',')).join('\n');
    const filename = `tws-${data.name}-${new Date().toISOString().slice(0, 10)}.csv`;
    try {
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    } catch (err) {
      /* sandboxed hosts can block blob downloads — show the data instead of failing silently */
      const w = window.open('', '_blank');
      if (w) { w.document.write('<pre style="font:12px/1.5 monospace;white-space:pre-wrap">' + esc(csv) + '</pre>'); w.document.title = filename; }
      else { toast('Your browser blocked the download. Allow pop-ups for this page and try again.', true); return; }
    }
    audit('Report exported', `${data.name} (${data.rows.length} rows)`);
    toast(`Exported ${fmtN(data.rows.length)} rows`);
  }
};
