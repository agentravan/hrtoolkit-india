<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HRToolKit India — HR Operations Intelligence Dashboard</title>
<style>
:root{
  --canvas:#F3F4F7; --surface:#FFFFFF; --surface-2:#FAFBFC;
  --ink:#151B23; --ink-2:#4A5563; --ink-3:#78808D; --line:#E3E6EB; --line-2:#EEF0F4;
  --rail:#0F1722; --rail-2:#18222F; --rail-ink:#9AA7B8; --rail-ink-2:#5E6C7E;
  --brand:#2B4ACB; --brand-soft:#EAEEFC; --brand-deep:#1E3496;
  --pos:#12795C; --pos-soft:#E5F3EE;
  --warn:#A66A12; --warn-soft:#FBF0DF;
  --neg:#B23B36; --neg-soft:#FAEAE9;
  --s1:#2B4ACB; --s2:#12795C; --s3:#A66A12; --s4:#7A46B8; --s5:#0E7490; --s6:#B23B36;
  --r:10px; --r-sm:6px;
  --shadow:0 1px 2px rgba(16,23,34,.06), 0 4px 14px rgba(16,23,34,.05);
  --rail-w:250px;
  --font:"Inter","Segoe UI",Roboto,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--canvas); color:var(--ink);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1,"cv05" 1;
}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.015em; color:var(--ink)}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px} h4{font-size:13px}
p{margin:0 0 10px}
a{color:var(--brand); text-decoration:none}
button{font-family:inherit; font-size:inherit; cursor:pointer}
input,select{font-family:inherit; font-size:14px}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.hidden{display:none!important}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; justify-content:center;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:8px 14px; border-radius:var(--r-sm); font-weight:500; line-height:1.2;
  transition:background .12s ease, border-color .12s ease;
}
.btn:hover{background:var(--surface-2); border-color:#D3D8E0}
.btn-primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn-primary:hover{background:var(--brand-deep); border-color:var(--brand-deep)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn-ghost:hover{background:var(--line-2)}
.btn-sm{padding:5px 10px; font-size:13px}
.btn-wa{background:#12795C; border-color:#12795C; color:#fff}
.btn-wa:hover{background:#0D5D46; border-color:#0D5D46}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* ---------- gate / landing ---------- */
#gate{min-height:100vh; display:flex; flex-direction:column; background:
  radial-gradient(900px 420px at 12% -8%, #1B2A44 0%, transparent 60%), var(--rail); color:#E8EDF4}
.gate-top{padding:26px 32px; display:flex; align-items:center; gap:12px}
.gate-body{flex:1; display:flex; align-items:center; justify-content:center; padding:12px 24px 56px}
.gate-inner{width:100%; max-width:1020px}
.gate-kicker{color:#8FA3BF; font-size:13px; margin-bottom:10px}
.gate-h{font-size:clamp(28px,4.2vw,44px); line-height:1.08; color:#fff; letter-spacing:-.03em; max-width:18ch}
.gate-sub{color:#9FB0C6; margin-top:14px; max-width:62ch}
.steps{display:flex; gap:8px; margin:26px 0 18px; flex-wrap:wrap}
.step-pill{font-size:12px; color:#7F91A9; border:1px solid #27364B; padding:5px 11px; border-radius:999px}
.step-pill.on{background:#22314A; border-color:#35496A; color:#DCE6F3}
.step-pill.done{color:#7ED0B2; border-color:#2A4A40; background:#16302A}
.choice-grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.choice{
  text-align:left; background:#16202D; border:1px solid #27364B; color:#E8EDF4;
  border-radius:14px; padding:20px; transition:border-color .15s ease, background .15s ease;
}
.choice:hover{background:#1B2837; border-color:#41577A}
.choice .ic{font-size:26px; display:block; margin-bottom:12px}
.choice .nm{font-size:17px; font-weight:600; color:#fff}
.choice .ds{font-size:13px; color:#93A5BC; margin-top:6px}
.opt-wrap{display:flex; flex-wrap:wrap; gap:9px}
.opt{
  background:#16202D; border:1px solid #27364B; color:#CBD7E6; padding:9px 14px;
  border-radius:999px; font-size:13.5px;
}
.opt:hover{background:#1D2A3B; border-color:#41577A; color:#fff}
.opt.sel{background:var(--brand); border-color:var(--brand); color:#fff}
.gate-actions{display:flex; gap:10px; align-items:center; margin-top:28px; flex-wrap:wrap}
.gate-note{font-size:12.5px; color:#7F91A9}
.demo-chip{display:inline-flex; align-items:center; gap:8px; font-size:12px; color:#B9E3D1;
  background:#16302A; border:1px solid #2A4A40; padding:5px 11px; border-radius:999px}

/* ---------- app frame ---------- */
#app{display:none; min-height:100vh}
#app.on{display:block}
.rail{
  position:fixed; inset:0 auto 0 0; width:var(--rail-w); background:var(--rail);
  color:var(--rail-ink); display:flex; flex-direction:column; z-index:40; overflow:hidden;
}
.rail-head{padding:16px 16px 14px; border-bottom:1px solid #1E2A3A; display:flex; gap:10px; align-items:center}
.logo{width:30px; height:30px; border-radius:8px; background:linear-gradient(140deg,#3D6BFF,#1E3496);
  display:grid; place-items:center; color:#fff; font-weight:700; font-size:12px; flex:none}
.rail-head .t{font-size:13.5px; color:#fff; font-weight:600; line-height:1.2}
.rail-head .s{font-size:11px; color:var(--rail-ink-2)}
.rail-scroll{flex:1; overflow-y:auto; padding:10px 10px 20px}
.rail-scroll::-webkit-scrollbar{width:8px}
.rail-scroll::-webkit-scrollbar-thumb{background:#24334A; border-radius:8px}
.nav-group{margin:14px 0 6px; padding:0 8px; font-size:11px; color:var(--rail-ink-2); letter-spacing:.04em}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none;
  border:0; color:var(--rail-ink); padding:8px 10px; border-radius:8px; font-size:13.5px;
}
.nav-item:hover{background:var(--rail-2); color:#DCE6F3}
.nav-item.on{background:#1E3496; color:#fff}
.nav-item .ic{width:18px; text-align:center; flex:none; font-size:14px}
.nav-item .lock{margin-left:auto; font-size:11px; color:var(--rail-ink-2)}
.rail-foot{padding:12px; border-top:1px solid #1E2A3A; font-size:12px; color:var(--rail-ink-2)}

.main{margin-left:var(--rail-w); min-height:100vh; display:flex; flex-direction:column}
.topbar{position:sticky; top:0; z-index:30; background:rgba(255,255,255,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.topbar-row{display:flex; align-items:center; gap:12px; padding:10px 20px}
.crumbs{font-size:12.5px; color:var(--ink-3); display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.crumbs b{color:var(--ink-2); font-weight:500}
.search-wrap{position:relative; margin-left:auto; width:min(320px,38vw)}
.search-wrap input{width:100%; padding:8px 12px 8px 32px; border:1px solid var(--line);
  border-radius:var(--r-sm); background:var(--surface-2)}
.search-wrap .si{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-3); font-size:13px}
.search-pop{position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); max-height:340px;
  overflow:auto; z-index:50; padding:6px}
.search-pop .res{padding:8px 10px; border-radius:6px; cursor:pointer; display:flex; gap:10px; align-items:center}
.search-pop .res:hover{background:var(--brand-soft)}
.search-pop .res .k{font-size:11px; color:var(--ink-3); margin-left:auto}
.icon-btn{border:1px solid var(--line); background:var(--surface); width:34px; height:34px;
  border-radius:var(--r-sm); display:grid; place-items:center; position:relative}
.icon-btn:hover{background:var(--surface-2)}
.dot{position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--neg)}
.who{display:flex; align-items:center; gap:9px; padding:4px 10px 4px 4px; border:1px solid var(--line);
  border-radius:999px; background:var(--surface)}
.avatar{width:26px; height:26px; border-radius:50%; background:var(--brand-soft); color:var(--brand-deep);
  display:grid; place-items:center; font-size:11px; font-weight:600; flex:none}
.who .n{font-size:12.5px; line-height:1.15} .who .r{font-size:10.5px; color:var(--ink-3)}

.filterbar{display:flex; gap:8px; padding:8px 20px 12px; align-items:center; flex-wrap:wrap;
  border-top:1px solid var(--line-2)}
.fsel{display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface);
  border-radius:999px; padding:4px 6px 4px 12px}
.fsel label{font-size:11px; color:var(--ink-3)}
.fsel select{border:0; background:transparent; font-size:13px; color:var(--ink); font-weight:500;
  padding:3px 4px; max-width:190px}
.sync{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-3)}

.content{padding:20px; flex:1}
.page-head{display:flex; align-items:flex-start; gap:14px; margin-bottom:16px; flex-wrap:wrap}
.page-head .sub{color:var(--ink-3); font-size:13px; margin-top:4px; max-width:80ch}
.page-head .acts{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}

/* ---------- cards / grid ---------- */
.grid{display:grid; gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)} .g23{grid-template-columns:2fr 1fr} .g32{grid-template-columns:1fr 2fr}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card-h{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line-2)}
.card-h .acts{margin-left:auto; display:flex; gap:6px}
.card-b{padding:16px}
.card-b.tight{padding:8px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 15px;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px; min-width:0}
.kpi{transition:border-color .14s ease, box-shadow .14s ease, transform .14s ease}
.kpi:hover{border-color:#CFD7E6; box-shadow:0 2px 6px rgba(16,23,34,.07), 0 10px 24px rgba(16,23,34,.07); transform:translateY(-1px)}
.kpi .lab{font-size:12px; color:var(--ink-3); display:flex; align-items:center; gap:6px}
.kpi .val{font-size:23px; font-weight:600; letter-spacing:-.02em; line-height:1.1}
.kpi .foot{font-size:12px; color:var(--ink-3); display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.delta{font-size:12px; font-weight:600; padding:1px 6px; border-radius:5px}
.delta.up{color:var(--pos); background:var(--pos-soft)}
.delta.down{color:var(--neg); background:var(--neg-soft)}
.delta.flat{color:var(--ink-2); background:var(--line-2)}
.bar-mini{height:5px; background:var(--line-2); border-radius:4px; overflow:hidden}
.bar-mini i{display:block; height:100%; border-radius:4px; background:var(--brand)}

.tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; padding:2px 8px; border-radius:999px;
  background:var(--line-2); color:var(--ink-2); font-weight:500}
.tag.pos{background:var(--pos-soft); color:var(--pos)}
.tag.warn{background:var(--warn-soft); color:var(--warn)}
.tag.neg{background:var(--neg-soft); color:var(--neg)}
.tag.brand{background:var(--brand-soft); color:var(--brand-deep)}

/* ---------- tables ---------- */
.tw{overflow:auto; max-height:520px}
table{width:100%; border-collapse:collapse; font-size:13px}
th{position:sticky; top:0; background:var(--surface-2); text-align:left; font-weight:600; font-size:11.5px;
  color:var(--ink-3); padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; z-index:2}
td{padding:9px 12px; border-bottom:1px solid var(--line-2); white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
tr.clickable{cursor:pointer}
td.r,th.r{text-align:right}
.mono{font-variant-numeric:tabular-nums}
.emp-cell{display:flex; align-items:center; gap:9px}
.rank{width:22px; height:22px; border-radius:6px; background:var(--line-2); display:grid; place-items:center;
  font-size:11px; font-weight:600; color:var(--ink-2); flex:none}
.rank.top{background:var(--brand-soft); color:var(--brand-deep)}

/* ---------- states ---------- */
.empty,.errbox{text-align:center; padding:40px 20px; color:var(--ink-3)}
.empty .t,.errbox .t{font-size:15px; color:var(--ink); font-weight:600; margin-bottom:6px}
.errbox{background:var(--neg-soft); border:1px solid #F0CFCD; border-radius:var(--r); color:#8C2F2B}
.skel{background:linear-gradient(90deg,#EEF0F4 25%,#F7F8FA 37%,#EEF0F4 63%); background-size:400% 100%;
  animation:sh 1.2s infinite linear; border-radius:6px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
.loading-rows{display:flex; flex-direction:column; gap:10px}
.loading-rows i{height:14px; display:block}

/* ---------- insights ---------- */
.insight{display:flex; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line-2); font-size:13px; align-items:flex-start}
.insight:last-child{border-bottom:0}
.insight .ic{flex:none; width:20px; height:20px; border-radius:6px; display:grid; place-items:center; font-size:11px}
.insight.good .ic{background:var(--pos-soft); color:var(--pos)}
.insight.warn .ic{background:var(--warn-soft); color:var(--warn)}
.insight.bad .ic{background:var(--neg-soft); color:var(--neg)}
.insight .why{color:var(--ink-3); font-size:12px; margin-top:2px}

/* ---------- health ---------- */
.health{display:flex; gap:20px; align-items:center; flex-wrap:wrap}
.health .score{font-size:44px; font-weight:600; letter-spacing:-.03em; line-height:1}
.health .score span{font-size:17px; color:var(--ink-3); font-weight:500}
.hcomp{display:grid; gap:8px; flex:1; min-width:260px}
.hrow{display:grid; grid-template-columns:132px 1fr 46px; gap:10px; align-items:center; font-size:12.5px}
.hrow .n{color:var(--ink-2)}
.hrow .v{text-align:right; color:var(--ink-2); font-weight:600}

/* ---------- tabs / chips ---------- */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto}
.tab{border:0; background:none; padding:9px 13px; color:var(--ink-3); font-size:13.5px; border-bottom:2px solid transparent;
  white-space:nowrap; font-weight:500}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand); border-bottom-color:var(--brand)}

/* ---------- dashboard picker cards ---------- */
.dash-grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
.dash-card{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:15px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:6px}
.dash-card:hover{border-color:#BFC9DC; background:var(--surface-2)}
.dash-card .ic{font-size:19px}
.dash-card .nm{font-weight:600; font-size:14px}
.dash-card .ds{font-size:12.5px; color:var(--ink-3)}
.dash-card .st{margin-top:auto; padding-top:8px; font-size:11.5px; color:var(--ink-3)}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(15,23,34,.55); display:grid; place-items:center; z-index:80; padding:18px}
.modal{background:var(--surface); border-radius:14px; width:min(460px,100%); box-shadow:0 24px 60px rgba(10,16,26,.3);
  max-height:92vh; overflow:auto}
.modal.wide{width:min(940px,100%)}
.modal-h{padding:18px 20px 0; display:flex; align-items:flex-start; gap:10px}
.modal-b{padding:16px 20px 20px}
.modal-f{padding:0 20px 20px; display:flex; gap:9px; justify-content:flex-end}
.field{margin-bottom:12px}
.field label{display:block; font-size:12.5px; color:var(--ink-2); margin-bottom:5px}
.field input,.field select,.field textarea{width:100%; padding:9px 11px; border:1px solid var(--line);
  border-radius:var(--r-sm); background:var(--surface)}
.field textarea{min-height:90px; resize:vertical; font-size:13px}
.hint{background:var(--surface-2); border:1px dashed var(--line); border-radius:var(--r-sm); padding:10px 12px;
  font-size:12.5px; color:var(--ink-2)}
.hint code{background:var(--line-2); padding:1px 5px; border-radius:4px; font-size:12px}

/* ---------- toast ---------- */
#toasts{position:fixed; right:16px; bottom:16px; z-index:100; display:flex; flex-direction:column; gap:8px}
.toast{background:var(--rail); color:#E8EDF4; padding:11px 15px; border-radius:9px; font-size:13px;
  box-shadow:0 10px 26px rgba(10,16,26,.28); max-width:340px}
.toast.bad{background:#7E2B27}

/* ---------- charts ---------- */
.viz{position:relative}
.chart{width:100%; display:block; overflow:visible}
.chart text{font-family:var(--font); font-size:10.5px; fill:var(--ink-3)}
.chart .gl{stroke:var(--line-2); stroke-width:1}
.chart .ref{stroke:var(--ink-3); stroke-width:1; stroke-dasharray:3 4; opacity:.5}
.chart .ref-t{font-size:9.5px; fill:var(--ink-3); opacity:.85}
.chart .hit{fill:transparent; cursor:crosshair}
.chart .cross{stroke:var(--ink-3); stroke-width:1; stroke-dasharray:3 3; opacity:0; transition:opacity .12s}
.chart .cross.on{opacity:.55}
.chart .dot{opacity:0; transition:opacity .12s, r .12s}
.chart .dot.on{opacity:1}
.chart .bar{transition:opacity .12s}
.chart .bar.dim{opacity:.34}
.chart .peak{opacity:.9}

.legend{display:flex; gap:14px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--ink-2); padding:2px 0 10px}
.legend i{width:9px; height:9px; border-radius:3px; display:inline-block; margin-right:6px}
.legend .li{cursor:pointer; user-select:none; padding:2px 6px; border-radius:5px; transition:background .12s, opacity .12s}
.legend .li:hover{background:var(--line-2)}
.legend .li.off{opacity:.4; text-decoration:line-through}
.viz-trend{margin-left:auto; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px}
.viz-trend.up{color:var(--pos); background:var(--pos-soft)}
.viz-trend.down{color:var(--neg); background:var(--neg-soft)}

/* tooltip */
.viz-tip{position:fixed; z-index:200; background:var(--rail); color:#DCE6F3; border-radius:9px;
  padding:9px 11px; font-size:12px; pointer-events:none; min-width:132px; max-width:260px;
  box-shadow:0 10px 30px rgba(10,16,26,.34); opacity:0; transform:translateY(5px);
  transition:opacity .12s ease, transform .12s ease}
.viz-tip.on{opacity:1; transform:none}
.viz-tip .t{font-weight:600; color:#fff; margin-bottom:6px; font-size:12.5px}
.viz-tip .r{display:flex; gap:14px; align-items:center; justify-content:space-between; padding:2px 0}
.viz-tip .r i{width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:7px}
.viz-tip .r b{color:#fff; font-variant-numeric:tabular-nums}

/* horizontal bars */
.hbars{display:grid; gap:9px}
.hb{display:grid; grid-template-columns:minmax(88px,30%) 1fr auto; gap:10px; align-items:center; font-size:12.5px;
  padding:2px 4px; border-radius:6px; transition:background .12s}
.hb.clickable{cursor:pointer}
.hb.clickable:hover{background:var(--brand-soft)}
.hb-k{color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hb-v{font-weight:600; color:var(--ink)}
.hbars .bar-mini i{animation:growRight .7s cubic-bezier(.22,1,.36,1) backwards}

/* donut */
.donut-wrap{display:flex; gap:18px; align-items:center; flex-wrap:wrap}
.donut-svg{width:154px; height:154px; flex:none}
.donut-seg{transition:stroke-width .14s ease, opacity .14s ease; cursor:pointer;
  animation:donutIn .7s cubic-bezier(.22,1,.36,1) backwards}
.donut-seg:hover,.donut-seg.on{stroke-width:29}
.donut-top{font-size:15px; font-weight:600; fill:var(--ink)}
.donut-sub{font-size:10px; fill:var(--ink-3)}
.donut-legend{flex:1; min-width:180px}
.dl-row{display:flex; gap:8px; align-items:center; font-size:12.5px; padding:3px 6px; border-radius:5px; transition:background .12s}
.dl-row.on{background:var(--line-2)}
.dl-row i{width:9px; height:9px; border-radius:3px; flex:none}
.dl-k{color:var(--ink-2); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dl-p{width:44px; text-align:right}

/* funnel */
.funnel{display:grid; gap:7px}
.fn-row{display:grid; grid-template-columns:112px 1fr; gap:10px; align-items:center}
.fn-k{font-size:12.5px; color:var(--ink-2)}
.fn-track{display:flex; align-items:center; gap:9px}
.fn-bar{height:26px; border-radius:5px; min-width:8px;
  background:linear-gradient(90deg,var(--s1),var(--s5)); animation:growRight .65s cubic-bezier(.22,1,.36,1) backwards}
.fn-v{font-size:12.5px}
.fn-d{font-size:11.5px; color:var(--ink-3)}

/* gauge + spark + stack */
.gauge-svg{width:100%; max-width:212px}
.gauge-arc{animation:sweepIn .9s cubic-bezier(.22,1,.36,1) backwards}
.gauge-needle{animation:fadeIn .6s .35s ease backwards}
.gauge-val{font-size:26px; font-weight:600; fill:var(--ink)}
.gauge-sub{font-size:10px; fill:var(--ink-3)}
.spark{width:88px; height:24px}
.spark-line{stroke-dasharray:200; stroke-dashoffset:200; animation:drawIn 1s ease forwards}
.stack{display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--line-2)}
.stack i{animation:growRight .6s cubic-bezier(.22,1,.36,1) backwards}

/* one orchestrated draw-in per render */
.chart .line{stroke-dasharray:4200; stroke-dashoffset:4200; animation:drawIn 1s cubic-bezier(.4,0,.2,1) forwards}
.chart .area{animation:fadeIn .9s .2s ease backwards}
.chart .bar{transform-origin:bottom; transform-box:fill-box; animation:growUp .5s cubic-bezier(.22,1,.36,1) backwards}
.chart .peak{animation:fadeIn .4s .8s ease backwards}
@keyframes drawIn{to{stroke-dashoffset:0}}
@keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growRight{from{width:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes donutIn{from{opacity:0; transform:rotate(-90deg) scale(.86); transform-origin:90px 90px}}
@keyframes sweepIn{from{stroke-dasharray:0 999}}
@media (prefers-reduced-motion:reduce){
  .chart .line{stroke-dasharray:none; stroke-dashoffset:0}
  .spark-line{stroke-dasharray:none; stroke-dashoffset:0}
}

/* ---------- employee 360 ---------- */
.e360-head{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.e360-av{width:52px; height:52px; border-radius:14px; background:var(--brand-soft); color:var(--brand-deep);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  if (abs >= 1e7) return sign + '₹' + round(abs / 1e7, 2) + ' Cr';
  if (abs >= 1e5) return sign + '₹' + round(abs / 1e5, 2) + ' L';
  if (abs >= 1e3) return sign + '₹' + round(abs / 1e3, 1) + 'K';
  return sign + '₹' + round(abs, 0);
}

function hashSeed(str) { let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function makeRng(seedStr) {
  let s = hashSeed(String(seedStr)) || 1;
  const r = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  r.int = (a, b) => a + Math.floor(r() * (b - a + 1));
  r.f = (a, b, d = 2) => round(a + r() * (b - a), d);
  r.pick = arr => arr[Math.floor(r() * arr.length)];
  r.weighted = pairs => { const t = sum(pairs, p => p[1]); let x = r() * t; for (const [v, w] of pairs) { if ((x -= w) <= 0) return v; } return pairs[pairs.length - 1][0]; };
  r.chance = p => r() < p;
  r.norm = (mean, sd) => { const u = Math.max(1e-9, r()), v = r(); return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

const FIRST_M = ['Amit', 'Rahul', 'Vikram', 'Sandeep', 'Arjun', 'Nikhil', 'Rohit', 'Karan', 'Manish', 'Pranav', 'Suresh', 'Deepak', 'Anil', 'Vivek', 'Gaurav', 'Harsh', 'Imran', 'Joseph', 'Kunal', 'Mohit', 'Naveen', 'Prakash', 'Rajesh', 'Sameer', 'Tarun', 'Uday', 'Varun', 'Yash', 'Abhishek', 'Siddharth', 'Farhan', 'Devendra', 'Ashok', 'Bhaskar', 'Chirag', 'Girish', 'Jatin', 'Lokesh', 'Nitin', 'Parth'];

const LAST = ['Sharma', 'Verma', 'Patel', 'Reddy', 'Nair', 'Iyer', 'Kulkarni', 'Desai', 'Mehta', 'Gupta', 'Singh', 'Kumar', 'Joshi', 'Chauhan', 'Bose', 'Banerjee', 'Rao', 'Naidu', 'Pillai', 'Shetty', 'Malhotra', 'Kapoor', 'Chopra', 'Sinha', 'Mishra', 'Tiwari', 'Yadav', 'Pandey', 'Bhatt', 'Trivedi', 'Ghosh', 'Dutta', 'Menon', 'Saxena', 'Agarwal', 'Khan', 'Ansari', 'D’Souza', 'Fernandes', 'Sethi'];

const DESIG = {
  exec: ['Chief Executive Officer', 'Chief Operating Officer', 'Chief Financial Officer', 'Chief People Officer'],
  head: ['Head', 'General Manager', 'Vice President', 'Director'],
  manager: ['Manager', 'Senior Manager', 'Assistant Manager', 'Team Lead'],
  exec_ic: ['Executive', 'Senior Executive', 'Associate', 'Analyst', 'Specialist'],
  worker: ['Operator', 'Senior Operator', 'Technician', 'Machine Operator', 'Line Worker', 'Helper']
};
const EMP_TYPES_FACTORY = [['Permanent', 55], ['Contract', 32], ['Apprentice', 8], ['Trainee', 5]];
const EMP_TYPES_OFFICE = [['Permanent', 82], ['Contract', 9], ['Intern', 5], ['Consultant', 4]];

const EXIT_REASONS = ['Better compensation', 'Career growth', 'Relocation', 'Higher studies', 'Work–life balance', 'Manager conflict', 'Health reasons', 'Performance exit', 'Role redundancy', 'Poor shift fit'];
const SOURCES = ['Employee referral', 'Job portal', 'Consultancy', 'Campus', 'Walk-in', 'LinkedIn', 'Internal movement'];
const SKILLS = ['Advanced Excel', 'Data analysis', 'Lean / 5S', 'Communication', 'Leadership', 'Statutory compliance', 'Negotiation', 'Root cause analysis', 'Customer handling', 'Safety awareness'];

/* =========================================================================
   DATA LAYER — deterministic synthetic record generation.
   Same scenario (business type + industry + size + location) always yields
   the same dataset, so numbers are stable and cross-checkable.
   ========================================================================= */
const Gen = (() => {

  function monthsBack(n) {
    const out = [], now = new Date();
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      out.push({ i: n - 1 - i, key: monthKey(d), date: d, days: new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() });
    }
    return out.map((m, idx) => ({ ...m, i: idx }));
  }

  const DEPT_WEIGHT = {
    factory: { 'Production': 46, 'Quality': 7, 'Maintenance': 7, 'Supply Chain': 4, 'Procurement': 3, 'Stores & Inventory': 5, 'HR': 4, 'Finance': 4, 'Safety & EHS': 3, 'Sales': 6, 'Operations': 5, 'IT': 2, 'Compliance': 2, 'Administration': 2 },
    corporate: { 'HR': 7, 'Finance': 8, 'Sales': 20, 'Marketing': 8, 'Operations': 20, 'IT': 12, 'Customer Success': 12, 'Procurement': 4, 'Legal': 3, 'Compliance': 3, 'Administration': 3 },
    startup: { 'Engineering': 32, 'Product': 8, 'Growth & Marketing': 12, 'Sales': 16, 'Customer Success': 12, 'Operations': 8, 'Finance': 5, 'HR': 4, 'Design': 3 }
  };

  /* industry levers — makes Pharma ≠ Textile ≠ SaaS */
  const IND = {
    'Pharmaceuticals': { margin: 1.22, quality: 1.35, comp: 1.3, attr: .85, safety: 1.2 },
    'Automotive': { margin: .92, quality: 1.1, comp: 1.05, attr: 1.05, safety: 1.05 },
    'Medical Devices': { margin: 1.18, quality: 1.3, comp: 1.25, attr: .9, safety: 1.1 },
    'Textile': { margin: .82, quality: .85, comp: .8, attr: 1.4, safety: .95 },
    'Garments': { margin: .78, quality: .85, comp: .75, attr: 1.5, safety: .9 },
    'Food Processing': { margin: .9, quality: 1.2, comp: 1.15, attr: 1.2, safety: 1.05 },
    'Chemicals': { margin: 1.05, quality: 1.15, comp: 1.3, attr: .95, safety: 1.3 },
    'Electronics': { margin: 1.0, quality: 1.1, comp: 1.0, attr: 1.05, safety: .9 },
    'IT / Software': { margin: 1.35, quality: 1.0, comp: 1.0, attr: 1.25, safety: .6 },
    'BPO / KPO': { margin: .88, quality: .95, comp: .95, attr: 1.75, safety: .6 },
    'Financial Services': { margin: 1.25, quality: 1.05, comp: 1.4, attr: 1.0, safety: .6 },
    'Healthcare': { margin: 1.05, quality: 1.25, comp: 1.3, attr: 1.0, safety: .9 },
    'E-commerce': { margin: .8, quality: .95, comp: .95, attr: 1.35, safety: .7 },
    'SaaS': { margin: 1.45, quality: 1.0, comp: .95, attr: 1.15, safety: .5 },
    'FinTech': { margin: 1.3, quality: 1.05, comp: 1.45, attr: 1.2, safety: .5 },
    'HealthTech': { margin: 1.2, quality: 1.15, comp: 1.3, attr: 1.1, safety: .55 },
    'D2C': { margin: .85, quality: 1.0, comp: .95, attr: 1.3, safety: .6 }
  };
  const indLever = name => Object.assign({ margin: 1, quality: 1, comp: 1, attr: 1, safety: 1 }, IND[name] || {});

  const CITY_COST = { 'Delhi NCR': 1.02, 'Mumbai': 1.14, 'Bengaluru': 1.12, 'Hyderabad': .98, 'Chennai': .95, 'Pune': 1.0, 'Kolkata': .9, 'Ahmedabad': .88, 'India (all)': 1.0, 'Other': .85 };

  /* base monthly CTC by grade, before industry + city multipliers */
  const GRADE_PAY = { exec: [450000, 900000], head: [190000, 340000], manager: [95000, 175000], ic: [38000, 88000], worker: [16500, 32000] };

  function build(scn) {
    const r = makeRng(`${scn.biz}|${scn.industry}|${scn.size}|${scn.location}|v4`);
    const sizeDef = SIZES.find(s => s.id === scn.size);
    const lever = indLever(scn.industry);
    const cost = CITY_COST[scn.location] || 1;
    const months = monthsBack(12);
    const biz = BUSINESS[scn.biz];
    const sites = scn.location === 'India (all)' || scn.location === 'Other'
      ? SITES[scn.location] : [scn.location, r.pick(['Delhi NCR', 'Pune', 'Hyderabad'].filter(x => x !== scn.location))];

    const head = Math.max(6, Math.round(sizeDef.head * r.f(.92, 1.08, 3)));
    const weights = DEPT_WEIGHT[scn.biz];
    const deptNames = Object.keys(weights);
    const wTotal = sum(deptNames, d => weights[d]);

    /* ---------------- departments + employees ---------------- */
    const departments = deptNames.map((name, i) => ({
      id: 'D' + String(i + 1).padStart(2, '0'), name,
      plan: Math.max(1, Math.round(head * weights[name] / wTotal)),
      headId: null, budget: 0
    }));

    const employees = [];
    let seq = 1000;
    const usedNames = new Set();
    function personName() {
      for (let k = 0; k < 60; k++) {
        const female = r.chance(scn.biz === 'factory' ? .26 : .42);
        const n = `${r.pick(female ? FIRST_F : FIRST_M)} ${r.pick(LAST)}`;
        if (!usedNames.has(n)) { usedNames.add(n); return { name: n, gender: female ? 'Female' : 'Male' }; }
      }
      const n = `${r.pick(FIRST_M)} ${r.pick(LAST)} ${usedNames.size}`; usedNames.add(n); return { name: n, gender: 'Male' };
    }
    function payFor(grade, dept) {
      const [lo, hi] = GRADE_PAY[grade];
      const deptLift = { 'Sales': 1.06, 'Finance': 1.05, 'Engineering': 1.18, 'IT': 1.1, 'Product': 1.15, 'Quality': 1.02, 'HR': .98, 'Administration': .9 }[dept] || 1;
      return Math.round(r.f(lo, hi, 0) * lever.comp * cost * deptLift / 100) * 100;
    }
    function doj(grade) {
      const maxYears = grade === 'exec' ? 12 : grade === 'head' ? 10 : grade === 'manager' ? 8 : 6;
      const daysAgo = Math.round(Math.pow(r(), 1.6) * 365 * maxYears) + 25;
      return new Date(Date.now() - daysAgo * 864e5);
    }
    function mk(dept, grade, site) {
      const { name, gender } = personName();
      const desig = grade === 'exec' ? r.pick(DESIG.exec)
        : grade === 'head' ? `${r.pick(DESIG.head)} — ${dept}`
          : grade === 'manager' ? `${r.pick(DESIG.manager)} — ${dept}`
            : grade === 'worker' ? r.pick(DESIG.worker)
              : `${r.pick(DESIG.exec_ic)} — ${dept}`;
      const j = doj(grade);
      const empTypes = scn.biz === 'factory' && grade === 'worker' ? EMP_TYPES_FACTORY : EMP_TYPES_OFFICE;
      const e = {
        id: 'HRTK-' + (++seq), name, gender, dept, grade, desig,
        site: site || r.pick(sites),
        doj: j, tenure: round((Date.now() - j) / 3.156e10, 1),
        type: grade === 'exec' || grade === 'head' ? 'Permanent' : r.weighted(empTypes),
        ctc: payFor(grade, dept) * 12,
        managerId: null, status: 'Active', band: { exec: 'E1', head: 'M3', manager: 'M2', ic: 'L2', worker: 'W1' }[grade],
        email: name.toLowerCase().replace(/[^a-z ]/g, '').split(' ').slice(0, 2).join('.') + '@demo.local'
      };
      employees.push(e); return e;
    }

    /* leadership */
    const nExec = head > 400 ? 4 : head > 100 ? 3 : 2;
    const execs = []; for (let i = 0; i < nExec; i++) execs.push(mk(r.pick(['Operations', 'Finance', 'HR'].filter(d => deptNames.includes(d))) || deptNames[0], 'exec', sites[0]));
    departments.forEach(d => {
      const h = mk(d.name, 'head'); d.headId = h.id; h.managerId = r.pick(execs).id;
      const mgrCount = clamp(Math.round(d.plan / 12), 1, 9);
      const mgrs = []; for (let i = 0; i < mgrCount; i++) { const m = mk(d.name, 'manager'); m.managerId = h.id; mgrs.push(m); }
      const rest = Math.max(0, d.plan - 1 - mgrCount);
      const workerDept = scn.biz === 'factory' && ['Production', 'Maintenance', 'Stores & Inventory', 'Quality'].includes(d.name);
      for (let i = 0; i < rest; i++) {
        const g = workerDept ? (r.chance(.86) ? 'worker' : 'ic') : 'ic';
        const e = mk(d.name, g); e.managerId = r.pick(mgrs).id;
      }
    });
    const byId = Object.fromEntries(employees.map(e => [e.id, e]));
    const active = () => employees.filter(e => e.status === 'Active');

    /* ---------------- exits / attrition ---------------- */
    const exits = [];
    const attrTarget = clamp(r.f(9, 19, 1) * lever.attr, 4, 42);
    const exitCount = Math.max(1, Math.round(employees.length * attrTarget / 100));
    const exitPool = r.shuffle(employees.filter(e => e.grade !== 'exec' && e.tenure > .3));
    for (let i = 0; i < Math.min(exitCount, exitPool.length); i++) {
      const e = exitPool[i];
      const m = months[r.int(0, 11)];
      const voluntary = r.chance(.78);
      exits.push({
        empId: e.id, name: e.name, dept: e.dept, grade: e.grade, site: e.site, mi: m.i,
        date: new Date(m.date.getFullYear(), m.date.getMonth(), r.int(2, 27)),
        voluntary, reason: voluntary ? r.pick(EXIT_REASONS.slice(0, 7)) : r.pick(['Performance exit', 'Role redundancy', 'Disciplinary']),
        tenure: round(Math.max(.2, e.tenure - r.f(0, .4, 2)), 1), ctc: e.ctc,
        managerId: e.managerId, regrettable: voluntary && r.chance(.44)
      });
      e.status = 'Exited'; e.dol = exits[exits.length - 1].date;
    }
    const joiners = employees.filter(e => (Date.now() - e.doj) / 864e5 < 365)
      .map(e => ({ empId: e.id, mi: months.findIndex(m => m.date.getFullYear() === e.doj.getFullYear() && m.date.getMonth() === e.doj.getMonth()), dept: e.dept, ctc: e.ctc }))
      .filter(j => j.mi >= 0);

    /* ---------------- attendance (monthly per employee) ---------------- */
    const attendance = [];
    employees.forEach(e => {
      const disc = clamp(r.norm(e.grade === 'worker' ? .93 : .96, .035), .72, .995);
      months.forEach(m => {
        if (e.doj > new Date(m.date.getFullYear(), m.date.getMonth() + 1, 0)) return;
        if (e.status === 'Exited' && e.dol < m.date) return;
        const workDays = m.days - (scn.biz === 'factory' ? 4 : 8) - (r.chance(.5) ? 1 : 0);
        const present = clamp(Math.round(workDays * disc * r.f(.96, 1.02, 3)), 0, workDays);
        const wfh = scn.biz === 'factory' || e.grade === 'worker' ? 0 : r.int(0, Math.round(workDays * .35));
        attendance.push({
          empId: e.id, dept: e.dept, mi: m.i, workDays, present,
          absent: workDays - present,
          late: r.int(0, e.grade === 'worker' ? 6 : 4),
          early: r.int(0, 3),
          ot: e.grade === 'worker' ? r.int(0, 34) : r.int(0, 12),
          wfh: Math.min(wfh, present)
        });
      });
    });

    /* ---------------- leave ---------------- */
    const LEAVE_TYPES = [['EL', 18], ['CL', 8], ['SL', 8], ['LWP', 0]];
    const leave = [];
    employees.forEach(e => LEAVE_TYPES.forEach(([type, ent]) => {
      const entitled = type === 'LWP' ? 0 : Math.round(ent * clamp(e.tenure, .3, 1.6) / 1.2);
      const taken = type === 'LWP' ? r.int(0, 3) : clamp(Math.round(entitled * r.f(.25, .95, 2)), 0, entitled);
      leave.push({ empId: e.id, dept: e.dept, type, entitled, taken, balance: Math.max(0, entitled - taken), pending: r.chance(.12) ? r.int(1, 3) : 0 });
    }));

    /* ---------------- payroll + salary history ---------------- */
    const payroll = [], salaryHistory = [];
    employees.forEach(e => {
      let monthly = e.ctc / 12;
      const hikes = Math.max(1, Math.floor(e.tenure));
      let cur = monthly;
      for (let k = 0; k < Math.min(hikes, 4); k++) {
        const hikePct = r.f(5, 16, 1) * (e.grade === 'exec' || e.grade === 'head' ? 1.1 : 1);
        const prev = Math.round(cur / (1 + hikePct / 100) / 100) * 100;
        salaryHistory.unshift({
          empId: e.id, date: new Date(Date.now() - (k + 1) * 365 * 864e5 + r.int(-40, 40) * 864e5),
          from: prev, to: Math.round(cur), pct: hikePct,
          reason: r.weighted([['Annual increment', 70], ['Promotion', 18], ['Market correction', 8], ['Retention', 4]])
        });
        cur = prev;
      }
      months.forEach(m => {
        const a = attendance.find(x => x.empId === e.id && x.mi === m.i); if (!a) return;
        const paidRatio = a.workDays ? clamp(a.present / a.workDays, 0, 1) : 1;
        const basic = monthly * .45, hra = monthly * .2, allow = monthly * .35;
        const otRate = e.grade === 'worker' ? (monthly / 26 / 8) * 2 : 0;
        const gross = Math.round((basic + hra + allow) * paidRatio + a.ot * otRate);
        const pf = Math.round(Math.min(basic * paidRatio, 15000) * .12);
        const esic = monthly <= 21000 ? Math.round(gross * .0075) : 0;
        const pt = monthly > 15000 ? 200 : 0;
        const tds = monthly > 60000 ? Math.round(gross * .09) : 0;
        payroll.push({
          empId: e.id, dept: e.dept, mi: m.i, gross, pf, esic, pt, tds,
          net: gross - pf - esic - pt - tds,
          employerCost: gross + pf + Math.round(monthly <= 21000 ? gross * .0325 : 0) + Math.round(basic * paidRatio * .0481),
          otHours: a.ot, otPay: Math.round(a.ot * otRate)
        });
      });
    });

    /* ---------------- performance (4 cycles) ---------------- */
    const CYCLES = ['FY25 H1', 'FY25 H2', 'FY26 H1', 'FY26 H2'];
    const performance = [];
    employees.forEach(e => {
      let base = clamp(r.norm(3.35, .62), 1.6, 4.9);
      CYCLES.forEach((c, i) => {
        if (e.tenure * 2 < (4 - i)) return;
        base = clamp(base + r.f(-.3, .32, 2), 1.5, 5);
        const rating = round(base, 1);
        performance.push({
          empId: e.id, dept: e.dept, cycle: c, ci: i, rating,
          kpiAch: round(clamp(58 + (rating - 3) * 17 + r.f(-9, 9, 1), 35, 132), 1),
          goals: r.int(4, 8), goalsMet: 0, feedback: rating >= 4.2 ? 'Consistently exceeds expectations; ready for stretch scope.'
            : rating >= 3.4 ? 'Reliable delivery against plan. Push on ownership of cross-team work.'
              : rating >= 2.6 ? 'Meets part of the plan. Needs a structured improvement plan this cycle.'
                : 'Below expectations on core KPIs. Formal improvement plan in progress.'
        });
      });
    });
    performance.forEach(p => p.goalsMet = Math.round(p.goals * clamp(p.kpiAch / 100, .2, 1)));

    /* ---------------- training ---------------- */
    const training = employees.map(e => {
      const hours = r.int(0, e.grade === 'worker' ? 34 : 62);
      return {
        empId: e.id, dept: e.dept, hours,
        cost: hours * r.int(180, 420),
        courses: Math.round(hours / 8),
        completed: Math.round(hours / 8 * r.f(.55, 1, 2)),
        certified: r.chance(.34) ? r.int(1, 3) : 0,
        gap: r.shuffle(SKILLS).slice(0, r.int(0, 2))
      };
    });

    /* ---------------- recruitment ---------------- */
    const recruitment = [];
    const reqCount = clamp(Math.round(head * .5), Math.min(24, head), 420);
    for (let i = 0; i < reqCount; i++) {
      const d = r.pick(departments);
      const m = months[r.int(0, 11)];
      const grade = r.weighted([['ic', 62], ['worker', scn.biz === 'factory' ? 90 : 4], ['manager', 16], ['head', 2]]);
      const cand = r.int(18, 120);
      const screened = Math.round(cand * r.f(.35, .6, 2));
      const shortlisted = Math.round(screened * r.f(.3, .55, 2));
      const interviewed = Math.round(shortlisted * r.f(.5, .85, 2));
      const offers = Math.max(0, Math.round(interviewed * r.f(.14, .35, 2)));
      const joinedN = Math.round(offers * r.f(.55, .95, 2));
      const status = joinedN > 0 ? 'Closed' : r.weighted([['Open', 55], ['In progress', 30], ['On hold', 15]]);
      recruitment.push({
        id: 'REQ-' + (2400 + i), dept: d.name, grade,
        position: grade === 'worker' ? r.pick(DESIG.worker) : grade === 'manager' ? `${r.pick(DESIG.manager)} — ${d.name}` : `${r.pick(DESIG.exec_ic)} — ${d.name}`,
        openedMi: m.i, openedDate: new Date(m.date.getFullYear(), m.date.getMonth(), r.int(1, 26)),
        source: r.weighted([['Employee referral', 22], ['Job portal', 28], ['Consultancy', 18], ['Campus', 10], ['Walk-in', scn.biz === 'factory' ? 25 : 6], ['LinkedIn', 14], ['Internal movement', 6]]),
        candidates: cand, screened, shortlisted, interviewed, offers, joined: joinedN,
        rejected: cand - offers,
        ttf: r.int(grade === 'worker' ? 6 : 18, grade === 'head' ? 96 : 62),
        cost: Math.round(r.f(6000, 92000, 0) * (grade === 'head' ? 2.4 : grade === 'worker' ? .2 : 1)),
        status, positions: r.int(1, grade === 'worker' ? 12 : 3)
      });
    }

    /* ---------------- engagement ---------------- */
    const engagement = {
      score: round(clamp(r.norm(72, 7) / lever.attr, 42, 92), 1),
      satisfaction: round(clamp(r.norm(74, 6), 45, 94), 1),
      enps: Math.round(clamp(r.norm(24, 16), -22, 62)),
      recognitions: r.int(Math.round(head * .08), Math.round(head * .3)),
      grievances: r.int(2, Math.max(4, Math.round(head * .05))),
      grievancesClosed: 0, responses: Math.round(head * r.f(.55, .92, 2))
    };
    engagement.grievancesClosed = Math.round(engagement.grievances * r.f(.55, .95, 2));

    /* ---------------- finance (monthly P&L) ---------------- */
    const revBase = sizeDef.rev * r.f(.85, 1.15, 3) * lever.margin * (scn.biz === 'startup' ? .55 : 1);
    const growth = scn.biz === 'startup' ? r.f(.04, .11, 3) : r.f(-.004, .022, 4);
    const finance = { monthly: [], budget: [] };
    months.forEach(m => {
      const season = 1 + Math.sin((m.date.getMonth() + 1) / 12 * Math.PI * 2) * .06;
      const revenue = Math.round(revBase / 12 * Math.pow(1 + growth, m.i) * season * r.f(.95, 1.06, 3));
      const payrollM = sum(payroll.filter(p => p.mi === m.i), p => p.employerCost);
      const cogs = Math.round(revenue * clamp(r.f(.42, .62, 3) / lever.margin, .22, .78));
      const opex = Math.round(revenue * r.f(.11, .19, 3)) + Math.round(payrollM * .16);
      finance.monthly.push({
        mi: m.i, key: m.key, revenue, cogs, opex, payroll: payrollM,
        target: Math.round(revenue * r.f(.9, 1.12, 3)),
        ar: Math.round(revenue * r.f(.6, 1.5, 2)), ap: Math.round(cogs * r.f(.4, 1.1, 2)),
        collections: Math.round(revenue * r.f(.78, 1.04, 3))
      });
    });
    finance.monthly.forEach(f => {
      f.grossProfit = f.revenue - f.cogs;
      f.profit = f.revenue - f.cogs - f.opex - f.payroll;
      f.ebitda = f.profit + Math.round(f.revenue * .03);
      f.cashIn = f.collections; f.cashOut = f.cogs + f.opex + f.payroll;
      f.netCash = f.cashIn - f.cashOut;
    });
    let cash = Math.round(revBase * (scn.biz === 'startup' ? .22 : .12));
    finance.monthly.forEach(f => { cash += f.netCash; f.cash = Math.max(0, cash); });
    departments.forEach(d => {
      const dPayroll = sum(payroll.filter(p => p.dept === d.name), p => p.employerCost);
      const other = Math.round(dPayroll * r.f(.18, .75, 2));
      const actual = dPayroll + other;
      d.budget = Math.round(actual * r.f(.88, 1.18, 3));
      finance.budget.push({ dept: d.name, budget: d.budget, actual, payroll: dPayroll, other });
    });

    /* ---------------- sales ---------------- */
    const salesDeptName = deptNames.includes('Sales') ? 'Sales' : deptNames[0];
    const salesPeople = employees.filter(e => e.dept === salesDeptName && e.status === 'Active' && e.grade !== 'head');
    const sales = { monthly: [], reps: [], funnel: {}, deals: [] };
    months.forEach(m => {
      const f = finance.monthly[m.i];
      sales.monthly.push({
        mi: m.i, key: m.key, revenue: f.revenue, target: f.target,
        deals: Math.max(1, Math.round(f.revenue / r.f(180000, 1400000, 0))),
        newCustomers: r.int(2, Math.max(4, Math.round(head / 22))),
        leads: r.int(120, 900), qualified: 0
      });
    });
    sales.monthly.forEach(s => s.qualified = Math.round(s.leads * r.f(.24, .46, 2)));
    const totalRev = sum(sales.monthly, s => s.revenue);
    const shares = salesPeople.map(() => r.f(.4, 1.8, 3));
    const shareSum = sum(shares) || 1;
    salesPeople.forEach((e, i) => {
      const rev = Math.round(totalRev * .72 * shares[i] / shareSum);
      const target = Math.round(rev / clamp(r.norm(1.0, .22), .55, 1.7));
      const deals = Math.max(1, Math.round(rev / r.f(220000, 1200000, 0)));
      sales.reps.push({
        empId: e.id, name: e.name, dept: e.dept, site: e.site, revenue: rev, target,
        ach: round(pct(rev, target), 1), deals, customers: Math.max(1, Math.round(deals * r.f(.4, .9, 2))),
        leads: r.int(40, 300), won: deals, lost: r.int(2, 40),        collection: Math.round(rev * r.f(.72, 1, 3)), avgDeal: Math.round(rev / deals)
      });
    });
    sales.reps.forEach(s => { s.conv = round(pct(s.won, s.won + s.lost), 1); });
    sales.reps.sort(byDesc('revenue')).forEach((s, i) => s.rank = i + 1);
    const leadsTot = sum(sales.monthly, s => s.leads);
    sales.funnel = {
      leads: leadsTot,
      qualified: sum(sales.monthly, s => s.qualified),
      opportunity: Math.round(sum(sales.monthly, s => s.qualified) * r.f(.45, .7, 2)),
      proposal: 0, negotiation: 0, won: sum(sales.reps, s => s.won), lost: sum(sales.reps, s => s.lost)
    };
    sales.funnel.proposal = Math.round(sales.funnel.opportunity * r.f(.5, .78, 2));
    sales.funnel.negotiation = Math.round(sales.funnel.proposal * r.f(.45, .8, 2));
    sales.pipeline = Math.round(totalRev / 12 * r.f(2.2, 4.4, 2));
    sales.forecast = Math.round(sales.pipeline * r.f(.22, .4, 3));

    /* ---------------- customers + customer success ---------------- */
    const customers = [];
    const custCount = clamp(Math.round(head * r.f(.6, 1.6, 2)), 100, 900);
    const SEG = ['Enterprise', 'Mid-market', 'SMB', 'Strategic'];
    for (let i = 0; i < custCount; i++) {
      const arr = Math.round(r.f(120000, 9500000, 0) * lever.margin);
      const since = new Date(Date.now() - r.int(40, 1900) * 864e5);
      const churned = r.chance(.11);
      customers.push({
        id: 'CUS-' + (4200 + i), name: `${r.pick(['Apex', 'Nova', 'Orbit', 'Sterling', 'Vertex', 'Meridian', 'Zenith', 'Bluewave', 'Kinetic', 'Larkspur', 'Ridgeline', 'Cobalt', 'Harbour', 'Trident', 'Solstice'])} ${r.pick(['Industries', 'Technologies', 'Labs', 'Retail', 'Logistics', 'Healthcare', 'Systems', 'Foods', 'Motors', 'Ventures'])}`,
        segment: r.weighted([[SEG[0], 18], [SEG[1], 34], [SEG[2], 40], [SEG[3], 8]]),
        arr, since, status: churned ? 'Churned' : 'Active',
        csat: round(clamp(r.norm(4.1, .55), 1.8, 5), 1),
        nps: Math.round(clamp(r.norm(38, 28), -60, 100)),
        tickets: r.int(0, 26), openTickets: r.int(0, 5),
        renewalMi: r.int(0, 11), upsell: r.chance(.24) ? Math.round(arr * r.f(.05, .35, 2)) : 0,
        owner: null, site: r.pick(sites)
      });
    }
    const csDeptName = deptNames.includes('Customer Success') ? 'Customer Success' : salesDeptName;
    const csPeople = employees.filter(e => e.dept === csDeptName && e.status === 'Active' && e.grade !== 'head');
    customers.forEach(c => { c.owner = csPeople.length ? r.pick(csPeople).id : null; });
    const cs = {
      monthly: months.map(m => ({
        mi: m.i, key: m.key,
        tickets: r.int(60, 620), resolved: 0, slaMet: 0,
        firstResponse: round(r.f(.4, 6.5, 1), 1), resolution: round(r.f(3, 42, 1), 1)
      }))
    };
    cs.monthly.forEach(x => { x.resolved = Math.round(x.tickets * r.f(.82, .99, 3)); x.slaMet = Math.round(x.resolved * r.f(.72, .97, 3)); });
    cs.agents = csPeople.map(e => {
      const owned = customers.filter(c => c.owner === e.id);
      return {
        empId: e.id, name: e.name, accounts: owned.length,
        retained: owned.filter(c => c.status === 'Active').length,
        csat: round(avg(owned, c => c.csat) || r.f(3.4, 4.8, 1), 2),
        tickets: sum(owned, c => c.tickets), upsell: sum(owned, c => c.upsell),
        resolution: round(r.f(4, 26, 1), 1), renewals: owned.filter(c => c.status === 'Active' && c.renewalMi < 6).length
      };
    });

    /* ---------------- marketing ---------------- */
    const CH = ['Google Ads', 'Meta Ads', 'LinkedIn', 'Email', 'Trade show', 'SEO / Content', 'Referral programme', 'Distributor programme'];
    const mktDeptName = deptNames.find(d => /Marketing/.test(d)) || salesDeptName;
    const mktPeople = employees.filter(e => e.dept === mktDeptName && e.status === 'Active' && e.grade !== 'head');
    const marketing = { campaigns: [] };
    for (let i = 0; i < r.int(14, 26); i++) {
      const spend = Math.round(r.f(45000, 2400000, 0));
      const leads = Math.max(5, Math.round(spend / r.f(420, 4200, 0)));
      const conv = r.f(.03, .18, 3);
      const custs = Math.max(0, Math.round(leads * conv));
      marketing.campaigns.push({
        id: 'CMP-' + (110 + i),
        name: `${r.pick(['Q1', 'Q2', 'Q3', 'Q4', 'Festive', 'Always-on', 'Launch', 'Winback'])} ${r.pick(CH)}`,
        channel: r.pick(CH), spend, leads, customers: custs,
        revenue: Math.round(custs * r.f(90000, 900000, 0) * lever.margin),
        impressions: leads * r.int(60, 700), clicks: leads * r.int(4, 22),
        ownerId: mktPeople.length ? r.pick(mktPeople).id : null,
        mi: r.int(0, 11), status: r.weighted([['Live', 40], ['Completed', 50], ['Paused', 10]])
      });
    }
    marketing.campaigns.forEach(c => { c.roi = round(pct(c.revenue - c.spend, c.spend), 1); c.cpl = Math.round(c.spend / c.leads); c.conv = round(pct(c.customers, c.leads), 1); });
    marketing.people = mktPeople.map(e => {
      const own = marketing.campaigns.filter(c => c.ownerId === e.id);
      return {
        empId: e.id, name: e.name, campaigns: own.length, spend: sum(own, c => c.spend),
        leads: sum(own, c => c.leads), customers: sum(own, c => c.customers), revenue: sum(own, c => c.revenue),
        roi: round(pct(sum(own, c => c.revenue) - sum(own, c => c.spend), sum(own, c => c.spend) || 1), 1),
        conv: round(pct(sum(own, c => c.customers), sum(own, c => c.leads) || 1), 1)
      };
    });

    /* ---------------- operations ---------------- */
    const opsDeptName = deptNames.includes('Operations') ? 'Operations' : deptNames[0];
    const opsPeople = employees.filter(e => e.dept === opsDeptName && e.status === 'Active' && e.grade !== 'head');
    const operations = {
      monthly: months.map(m => {
        const planned = r.int(2000, 26000);
        return {
          mi: m.i, key: m.key, planned, output: Math.round(planned * r.f(.82, 1.08, 3)),
          sla: round(clamp(r.norm(92, 5), 62, 99.4), 1), errors: r.int(3, 90),
          utilisation: round(clamp(r.norm(78, 8), 45, 97), 1),
          costPerUnit: round(r.f(42, 460, 2), 2)
        };
      })
    };
    operations.people = opsPeople.map(e => ({
      empId: e.id, name: e.name,
      output: r.int(400, 4200), target: 0, sla: round(clamp(r.norm(92, 6), 58, 99.5), 1),
      errors: r.int(0, 26), efficiency: round(clamp(r.norm(96, 11), 60, 128), 1),
      saving: Math.round(r.f(0, 420000, 0))
    }));
    operations.people.forEach(p => { p.target = Math.round(p.output / clamp(p.efficiency / 100, .5, 1.4)); });

    /* ---------------- IT ---------------- */
    const itDeptName = deptNames.includes('IT') ? 'IT' : (deptNames.includes('Engineering') ? 'Engineering' : deptNames[0]);
    const itPeople = employees.filter(e => e.dept === itDeptName && e.status === 'Active' && e.grade !== 'head');
    const it = {
      monthly: months.map(m => {
        const raised = r.int(40, 700);
        return {
          mi: m.i, key: m.key, raised, closed: Math.round(raised * r.f(.8, 1.02, 3)),
          uptime: round(clamp(r.norm(99.4, .55), 95.5, 99.99), 2),
          incidents: r.int(0, 7), security: r.int(0, 4),
          mttr: round(r.f(1.2, 18, 1), 1)
        };
      }),
      projects: r.int(3, 18)
    };
    it.people = itPeople.map(e => ({
      empId: e.id, name: e.name, closed: r.int(20, 420), sla: round(clamp(r.norm(91, 7), 55, 99.6), 1),
      mttr: round(r.f(1, 22, 1), 1), projects: r.int(0, 5), incidents: r.int(0, 6),
      reopened: r.int(0, 18)
    }));

    /* ---------------- procurement ---------------- */
    const VENDORS = ['Shakti Engineering', 'Prime Polymers', 'Aditya Metals', 'Nexgen Packaging', 'Sunrise Chemicals', 'Gitanjali Traders', 'Falcon Logistics', 'Orion Components', 'Vishwas Industries', 'Sagar Electricals', 'Trimurti Steel', 'Bluepeak Supplies'];
    const procDeptName = deptNames.includes('Procurement') ? 'Procurement' : deptNames[0];
    const procPeople = employees.filter(e => e.dept === procDeptName && e.status === 'Active' && e.grade !== 'head');
    const procurement = { vendors: [], pos: [] };
    VENDORS.forEach((v, i) => procurement.vendors.push({
      id: 'VEN-' + (300 + i), name: v, category: r.pick(['Raw material', 'Consumables', 'Services', 'Capex', 'Logistics', 'IT & software']),
      onTime: round(clamp(r.norm(88, 9), 45, 100), 1), quality: round(clamp(r.norm(92, 6), 55, 100), 1),
      spend: 0, orders: 0, score: 0
    }));
    const poCount = clamp(Math.round(head * 1.1), 90, 700);
    for (let i = 0; i < poCount; i++) {
      const v = r.pick(procurement.vendors), m = months[r.int(0, 11)];
      const value = Math.round(r.f(18000, 4200000, 0));
      const quoted = Math.round(value * r.f(1.0, 1.22, 3));
      const cycle = r.int(2, 38);
      procurement.pos.push({
        id: 'PO-' + (9000 + i), vendorId: v.id, vendor: v.name, mi: m.i, value, quoted,
        saving: quoted - value, cycle, delayed: r.chance(.18),
        buyerId: procPeople.length ? r.pick(procPeople).id : null,
        status: r.weighted([['Delivered', 68], ['In transit', 18], ['Open', 10], ['Cancelled', 4]])
      });
    }
    procurement.vendors.forEach(v => {
      const po = procurement.pos.filter(p => p.vendorId === v.id);
      v.spend = sum(po, p => p.value); v.orders = po.length;
      v.score = round((v.onTime * .5 + v.quality * .5) - (po.filter(p => p.delayed).length / (po.length || 1)) * 12, 1);
    });
    procurement.buyers = procPeople.map(e => {
      const po = procurement.pos.filter(p => p.buyerId === e.id);
      return {
        empId: e.id, name: e.name, pos: po.length, value: sum(po, p => p.value), saving: sum(po, p => p.saving),
        cycle: round(avg(po, p => p.cycle), 1), delayed: po.filter(p => p.delayed).length
      };
    });

    /* ---------------- factory: production, quality, maintenance, safety, inventory, supply chain */
    let production = null, maintenance = null, safety = null, inventory = null, supplychain = null;
    if (scn.biz === 'factory') {
      const lines = ['Line A', 'Line B', 'Line C', 'Line D', 'Packing'].slice(0, r.int(3, 5));
      production = {
        lines, uom: r.pick(['units', 'kg', 'boxes', 'litres', 'metres']),
        monthly: months.map(m => {
          const target = r.int(40000, 320000);
          const actual = Math.round(target * clamp(r.norm(.97, .09), .68, 1.16));
          const availability = round(clamp(r.norm(89, 5.5), 62, 98.5), 1);
          const perf = round(clamp(r.norm(88, 7), 55, 99), 1);
          const qual = round(clamp(r.norm(96.5, 2.2) * (lever.quality > 1.15 ? 1.01 : 1), 82, 99.8), 1);
          return {
            mi: m.i, key: m.key, target, actual, availability, perf, qual,
            oee: round(availability * perf * qual / 10000, 1),
            capacity: Math.round(target * r.f(1.05, 1.35, 3)),
            rejected: Math.round(actual * (100 - qual) / 100),
            rework: Math.round(actual * r.f(.004, .03, 4)),
            downtime: Math.round((100 - availability) / 100 * 24 * 26),
            plannedDowntime: r.int(20, 90),
            shifts: [0, 0, 0]
          };
        })
      };
      production.monthly.forEach(p => {
        const w = [r.f(.3, .42, 3), r.f(.28, .38, 3)]; const third = 1 - w[0] - w[1];
        p.shifts = [Math.round(p.actual * w[0]), Math.round(p.actual * w[1]), Math.round(p.actual * Math.max(.12, third))];
        p.lineOut = lines.map(l => ({ line: l, output: Math.round(p.actual / lines.length * r.f(.7, 1.3, 2)), eff: round(clamp(r.norm(92, 9), 55, 118), 1) }));
        p.costOfQuality = Math.round((p.rejected + p.rework) * r.f(120, 900, 0));
      });
      const machines = [];
      for (let i = 0; i < r.int(10, 28); i++) {
        const breakdowns = r.int(0, 14), downH = round(r.f(2, 180, 1), 1);
        machines.push({
          id: 'MC-' + (100 + i), name: `${r.pick(['Press', 'CNC', 'Mixer', 'Filler', 'Extruder', 'Packer', 'Compressor', 'Boiler', 'Granulator', 'Coater'])} ${i + 1}`,
          line: r.pick(lines), breakdowns, downtime: downH,
          pmDue: r.chance(.3), pmDone: r.int(4, 12),
          mtbf: round(720 / Math.max(1, breakdowns), 1), mttr: round(downH / Math.max(1, breakdowns), 1),
          condition: r.weighted([['Good', 62], ['Watch', 26], ['Critical', 12]])
        });
      }
      maintenance = {
        machines, monthly: months.map(m => ({
          mi: m.i, key: m.key, breakdown: r.int(1, 22), pmPlanned: r.int(8, 40), pmDone: 0,
          downtime: round(r.f(8, 160, 1), 1), cost: Math.round(r.f(40000, 900000, 0))
        }))
      };
      maintenance.monthly.forEach(x => x.pmDone = Math.round(x.pmPlanned * r.f(.6, 1, 2)));
      safety = {
        monthly: months.map(m => ({
          mi: m.i, key: m.key,
          incidents: Math.max(0, Math.round(r.norm(2.2 * lever.safety, 1.6))),
          nearMiss: r.int(0, 12), lti: r.chance(.18 * lever.safety) ? r.int(1, 2) : 0,
          trainingHours: r.int(20, 320), auditScore: round(clamp(r.norm(84, 8), 52, 99), 1),
          ppaCompliance: round(clamp(r.norm(93, 5), 66, 100), 1)
        }))
      };
      safety.incidents = [];
      safety.monthly.forEach(m => {
        for (let k = 0; k < m.incidents; k++) safety.incidents.push({
          mi: m.mi, type: r.pick(['Slip / trip', 'Cut / laceration', 'Chemical splash', 'Material handling', 'Machine guard', 'Electrical', 'Fire near-miss']),
          severity: r.weighted([['Minor', 66], ['Moderate', 26], ['Major', 8]]),
          area: r.pick(production.lines.concat(['Stores', 'Utility', 'Dispatch'])), lost: r.int(0, 6)
        });
      });
      const RM = ['Steel coil', 'Resin', 'API powder', 'Cotton yarn', 'PCB board', 'Glass bottle', 'Corrugated box', 'Solvent', 'Label roll', 'Aluminium foil'];
      inventory = {
        items: r.shuffle(RM).slice(0, 8).map((n, i) => {
          const value = Math.round(r.f(400000, 22000000, 0));
          return {
            id: 'SKU-' + (700 + i), name: n, cat: r.weighted([['Raw material', 55], ['WIP', 20], ['Finished goods', 25]]),
            value, qty: r.int(200, 24000), uom: r.pick(['kg', 'nos', 'ltr', 'mtr']),
            days: r.int(6, 96), reorder: r.chance(.28), aging: r.int(2, 180)
          };
        })
      };
      supplychain = {
        suppliers: procurement.vendors.map(v => ({
          name: v.name, onTime: v.onTime, leadTime: r.int(3, 45), rejectionPct: round(r.f(.1, 6, 2), 2),
          spend: v.spend, delays: procurement.pos.filter(p => p.vendorId === v.id && p.delayed).length
        })),
        monthly: months.map(m => ({
          mi: m.i, key: m.key, dispatches: r.int(30, 400), onTimeDelivery: round(clamp(r.norm(91, 6), 58, 99.5), 1),
          logisticsCost: Math.round(r.f(200000, 4200000, 0)), freightPerUnit: round(r.f(4, 60, 2), 2)
        }))
      };
    }

    /* ---------------- startup metrics ---------------- */
    let startup = null;
    if (scn.biz === 'startup') {
      let mrr = revBase / 12 / Math.pow(1 + growth, 11);
      let custs = Math.max(8, Math.round(mrr / r.f(9000, 60000, 0)));
      const cacBase = r.f(18000, 180000, 0);
      startup = { monthly: [], funding: [] };
      let cashBal = Math.round(revBase * r.f(.4, 1.1, 2));
      months.forEach(m => {
        const newCust = Math.max(1, Math.round(custs * r.f(.05, .16, 3)));
        const churnCust = Math.round(custs * r.f(.005, .045, 4));
        const arpu = mrr / custs;
        custs = custs + newCust - churnCust;
        const newMrr = Math.round(newCust * arpu * r.f(.9, 1.25, 3));
        const churnMrr = Math.round(churnCust * arpu);
        const expansion = Math.round(mrr * r.f(.004, .03, 4));
        mrr = Math.max(1, mrr + newMrr - churnMrr + expansion);
        const f = finance.monthly[m.i];
        const spend = f.cogs + f.opex + f.payroll;
        const burn = spend - f.revenue;
        cashBal = Math.max(0, cashBal - burn);
        const marketingSpend = Math.round(f.opex * r.f(.2, .48, 3));
        startup.monthly.push({
          mi: m.i, key: m.key, mrr: Math.round(mrr), arr: Math.round(mrr * 12),
          newMrr, churnMrr, expansion, customers: custs, newCust, churnCust,
          burn, cash: cashBal, spend,
          cac: Math.round(marketingSpend / Math.max(1, newCust)),
          arpu: Math.round(arpu),
          grossMargin: round(pct(f.grossProfit, f.revenue), 1)
        });
      });
      startup.monthly.forEach(s => {
        s.churnRate = round(pct(s.churnCust, s.customers), 2);
        s.ltv = Math.round(s.arpu * (s.grossMargin / 100) / Math.max(.005, s.churnRate / 100));
        s.ltvCac = round(s.ltv / Math.max(1, s.cac), 2);
      });
      const rounds = ['Pre-seed', 'Seed', 'Pre-Series A', 'Series A'];
      let raised = 0;
      for (let i = 0; i < r.int(1, 3); i++) {
        const amt = Math.round(r.f(1.2e7, 3.2e8, 0)); raised += amt;
        startup.funding.push({ round: rounds[i], amount: amt, date: new Date(Date.now() - r.int(200, 1300) * 864e5), investors: r.int(1, 6) });
      }
      startup.raised = raised;
      startup.valuation = Math.round(raised * r.f(3.5, 9, 2));
    }

    /* ---------------- compliance ---------------- */
    const compBase = [
      ['Provident Fund (EPF) return', 'Statutory', 'Monthly'], ['ESIC contribution', 'Statutory', 'Monthly'],
      ['Professional Tax', 'Statutory', 'Monthly'], ['Labour Welfare Fund', 'Statutory', 'Half-yearly'],
      ['TDS return (24Q)', 'Tax', 'Quarterly'], ['GST return', 'Tax', 'Monthly'],
      ['Shops & Establishment renewal', 'Registration', 'Annual'], ['POSH committee filing', 'Governance', 'Annual'],
      ['Form 16 issuance', 'Statutory', 'Annual'], ['Gratuity provisioning', 'Statutory', 'Annual'],
      ['Minimum wages revision', 'Labour', 'Half-yearly'], ['Bonus Act compliance', 'Labour', 'Annual'],
      ['Employment contracts on file', 'Documentation', 'Ongoing'], ['Background verification', 'Documentation', 'Ongoing']
    ];
    const factoryComp = [
      ['Factory License renewal', 'Factory', 'Annual'], ['Contract Labour (CLRA) licence', 'Factory', 'Annual'],
      ['Pollution Control Board consent', 'EHS', 'Annual'], ['Fire safety NOC', 'EHS', 'Annual'],
      ['Boiler inspection certificate', 'EHS', 'Annual'], ['Form 11 safety register', 'EHS', 'Quarterly'],
      ['Contractor compliance audit', 'Factory', 'Quarterly'], ['Hazardous waste manifest', 'EHS', 'Monthly']
    ];
    const compliance = (scn.biz === 'factory' ? compBase.concat(factoryComp) : compBase).map(([item, cat, freq], i) => {
      const due = new Date(Date.now() + r.int(-40, 120) * 864e5);
      const status = due < new Date() ? r.weighted([['Completed', 72], ['Overdue', 28]]) : r.weighted([['Completed', 40], ['Pending', 60]]);
      return {
        id: 'CMP-' + (500 + i), item, category: cat, frequency: freq, due, status,
        owner: r.pick(employees.filter(e => ['HR', 'Finance', 'Compliance', 'Legal', 'Safety & EHS'].includes(e.dept) && e.status === 'Active') || employees).name,
        risk: status === 'Overdue' ? r.pick(['High', 'Medium']) : r.pick(['Low', 'Medium'])
      };
    });

    /* ------------- month-on-month employee performance -------------------
       Every employee gets a KPI record for every month they were on the
       rolls. Where a functional dataset already exists (sales, CS, IT, ops,
       marketing, procurement) the monthly values are a distribution of that
       employee's annual total, so the two views always reconcile. Everyone
       else gets a department-appropriate metric driven by their attendance
       and their review rating, so the monthly numbers agree with the
       half-yearly cycle rather than contradicting it. */
    const GENERIC_METRIC = {
      'HR': ['Cases closed', 16, 'cases'], 'Finance': ['Transactions processed', 130, 'txns'],
      'Compliance': ['Filings and checks', 13, 'items'], 'Legal': ['Contracts reviewed', 11, 'contracts'],
      'Administration': ['Requests closed', 42, 'requests'], 'Quality': ['Inspections completed', 170, 'checks'],
      'Maintenance': ['Jobs closed', 27, 'jobs'], 'Stores & Inventory': ['Stock transactions', 215, 'txns'],
      'Safety & EHS': ['Audits and drills', 9, 'audits'], 'Supply Chain': ['Shipments handled', 46, 'shipments'],
      'Production': ['Units produced', 0, 'units'], 'Engineering': ['Story points delivered', 21, 'points'],
      'Product': ['Specs shipped', 5, 'specs'], 'Design': ['Designs delivered', 9, 'designs'],
      'Sales': ['Revenue booked', 0, '₹'], 'Growth & Marketing': ['Leads generated', 58, 'leads'],
      'Marketing': ['Leads generated', 58, 'leads'], 'Customer Success': ['Tickets resolved', 86, 'tickets'],
      'IT': ['Tickets closed', 72, 'tickets'], 'Operations': ['Units processed', 300, 'units'],
      'Procurement': ['Purchase orders processed', 17, 'POs']
    };
    const GRADE_LOAD = { exec: .45, head: .55, manager: .75, ic: 1, worker: 1.15 };

    const repById = Object.fromEntries(sales.reps.map(x => [x.empId, x]));
    const csById = Object.fromEntries(cs.agents.map(x => [x.empId, x]));
    const mkById = Object.fromEntries(marketing.people.map(x => [x.empId, x]));
    const itById = Object.fromEntries(it.people.map(x => [x.empId, x]));
    const opById = Object.fromEntries(operations.people.map(x => [x.empId, x]));
    const buyById = Object.fromEntries(procurement.buyers.map(x => [x.empId, x]));
    const attIdx = {}; attendance.forEach(a => { attIdx[a.empId + '|' + a.mi] = a; });
    const ratingById = {};
    Object.entries(groupBy(performance, x => x.empId)).forEach(([id, rows]) => {
      ratingById[id] = avg(rows, x => x.rating);
    });
    const prodWorkers = employees.filter(e => e.dept === 'Production' && e.status === 'Active').length || 1;

    function spread(total, n) {
      const w = Array.from({ length: n }, () => r.f(.62, 1.44, 3));
      const t = sum(w) || 1;
      return w.map(x => total * x / t);
    }

    const empMonthly = [];
    employees.forEach(e => {
      const live = months.filter(m => {
        const endOfMonth = new Date(m.date.getFullYear(), m.date.getMonth() + 1, 0);
        if (e.doj > endOfMonth) return false;
        if (e.status === 'Exited' && e.dol < m.date) return false;
        return true;
      });
      if (!live.length) return;

      const rating = ratingById[e.id] || 3.2;
      const effMean = clamp(.8 + (rating - 3) * .085, .55, 1.25);
      const rep = repById[e.id], csa = csById[e.id], mk = mkById[e.id],
        itp = itById[e.id], op = opById[e.id], bu = buyById[e.id];

      let metric, unit, money = false, actuals = null, targets = null, secondary = null;
      if (rep) {
        metric = 'Revenue booked'; unit = '₹'; money = true;
        actuals = spread(rep.revenue, live.length); targets = spread(rep.target, live.length);
        secondary = { label: 'Deals', values: spread(rep.deals, live.length).map(v => Math.max(0, Math.round(v))) };
      } else if (csa) {
        metric = 'Tickets resolved'; unit = 'tickets';
        actuals = spread(csa.tickets, live.length);
        targets = actuals.map(v => v / clamp(r.norm(effMean, .12), .55, 1.3));
        secondary = { label: 'CSAT', values: live.map(() => round(clamp(r.norm(csa.csat, .25), 1.5, 5), 2)) };
      } else if (mk) {
        metric = 'Leads generated'; unit = 'leads';
        actuals = spread(mk.leads, live.length);
        targets = actuals.map(v => v / clamp(r.norm(effMean, .14), .5, 1.35));
        secondary = { label: 'Customers', values: spread(mk.customers, live.length).map(v => Math.round(v)) };
      } else if (itp) {
        metric = 'Tickets closed'; unit = 'tickets';
        actuals = spread(itp.closed, live.length);
        targets = actuals.map(v => v / clamp(r.norm(effMean, .12), .55, 1.3));
        secondary = { label: 'SLA %', values: live.map(() => round(clamp(r.norm(itp.sla, 4), 40, 100), 1)) };
      } else if (op) {
        metric = 'Units processed'; unit = 'units';
        actuals = spread(op.output, live.length); targets = spread(op.target, live.length);
        secondary = { label: 'Errors', values: spread(op.errors, live.length).map(v => Math.round(v)) };
      } else if (bu) {
        metric = 'Purchase orders processed'; unit = 'POs';
        actuals = spread(bu.pos, live.length).map(v => Math.max(0, Math.round(v)));
        targets = actuals.map(v => Math.max(1, v / clamp(r.norm(effMean, .15), .5, 1.4)));
        secondary = { label: 'Saving', values: spread(bu.saving, live.length).map(v => Math.round(v)) };
      } else {
        const def = GENERIC_METRIC[e.dept] || ['Tasks completed', 38, 'tasks'];
        metric = def[0]; unit = def[2];
        const load = GRADE_LOAD[e.grade] || 1;
        let base = def[1] * load;
        if (e.dept === 'Production' && production) base = 0;
        targets = live.map(m => {
          if (e.dept === 'Production' && production) {
            const pm = production.monthly[m.i];
            return Math.round(pm.target / prodWorkers * load);
          }
          return Math.max(1, Math.round(base * r.f(.9, 1.1, 3)));
        });
        actuals = live.map((m, i) => {
          const a = attIdx[e.id + '|' + m.i];
          const attRatio = a && a.workDays ? clamp(a.present / a.workDays, .3, 1.05) : 1;
          return Math.max(0, targets[i] * clamp(r.norm(effMean, .13), .35, 1.45) * attRatio);
        });
      }

      live.forEach((m, i) => {
        const a = attIdx[e.id + '|' + m.i];
        const attPct = a && a.workDays ? round(pct(a.present, a.workDays), 1) : 100;
        const actual = money ? Math.round(actuals[i]) : round(actuals[i], unit === '₹' ? 0 : 1);
        const target = money ? Math.round(targets[i]) : round(Math.max(1, targets[i]), 1);
        const ach = round(pct(actual, target || 1), 1);
        const quality = round(clamp(r.norm(94 - (3.5 - rating) * 4, 4.5), 55, 100), 1);
        const score = round(clamp(.5 * Math.min(ach, 125) + .25 * attPct + .25 * quality, 0, 100), 1);
        empMonthly.push({
          empId: e.id, dept: e.dept, grade: e.grade, site: e.site, mi: m.i, monthKey: m.key,
          metric, unit, money, target, actual, ach,
          attendancePct: attPct, otHours: a ? a.ot : 0,
          quality, score, rating: round(clamp(score / 20, 1, 5), 1),
          secondaryLabel: secondary ? secondary.label : '',
          secondaryValue: secondary ? secondary.values[i] : ''
        });
      });
    });

    /* ---------------- audit seed ---------------- */
    const db = {
      scn, months, departments, employees, byId, exits, joiners, attendance, leave, payroll, salaryHistory,
      performance, cycles: CYCLES, training, recruitment, engagement, finance, sales, customers, cs, marketing, empMonthly,
      operations, it, procurement, production, maintenance, safety, inventory, supplychain, startup, compliance,
      sites, lever, sizeDef, generatedAt: new Date(),
      meta: {
        salesDept: salesDeptName, csDept: csDeptName, mktDept: mktDeptName,
        opsDept: opsDeptName, itDept: itDeptName, procDept: procDeptName,
        uom: production ? production.uom : 'units'
      }
    };
    db.users = buildUsers(db);
    return db;
  }

  /* ----------------------- credentials --------------------------------- */
  function buildUsers(db) {
    const users = [
      { username: 'demo.admin', password: 'Demo@2026#Admin', role: 'SUPER_ADMIN', name: 'Platform administrator', empId: null },
      { username: 'demo.hr', password: 'Demo@2026#HR', role: 'HR_ADMIN', name: 'HR administrator', empId: null },
      { username: 'demo.saleshead', password: 'Demo@2026#Sales', role: 'DEPT_HEAD', name: 'Sales head', empId: null, dept: db.meta.salesDept },
      { username: 'demo.finance', password: 'Demo@2026#Finance', role: 'FINANCE_ADMIN', name: 'Finance administrator', empId: null },
      { username: 'demo.employee', password: 'Demo@2026#Employee', role: 'EMPLOYEE', name: 'Demo employee', empId: null }
    ];
    const salesHead = db.employees.find(e => e.dept === db.meta.salesDept && e.grade === 'head');
    if (salesHead) { users[2].empId = salesHead.id; users[2].name = salesHead.name; }
    const anyEmp = db.employees.find(e => e.grade === 'ic' && e.status === 'Active') || db.employees[0];
    users[4].empId = anyEmp.id; users[4].name = anyEmp.name; users[4].dept = anyEmp.dept;
    /* every head / manager / employee can sign in with their employee ID */
    db.employees.forEach(e => {
      if (e.status !== 'Active') return;
      const role = e.grade === 'head' ? 'DEPT_HEAD' : e.grade === 'manager' ? 'MANAGER' : e.grade === 'exec' ? 'SUPER_ADMIN' : 'EMPLOYEE';
      users.push({
        username: e.id, password: role === 'DEPT_HEAD' ? 'Demo@2026#Head' : role === 'MANAGER' ? 'Demo@2026#Manager' : 'Demo@2026#Employee',
        role, name: e.name, empId: e.id, dept: e.dept, generated: true
      });
    });
    return users;
  }

  return { build };
})();

/* =========================================================================
   STATE, SCOPE & ANALYTICS
   ========================================================================= */
let DB = null;

const State = {
  scn: { biz: null, industry: null, size: null, location: null },
  filters: { dept: 'All', site: 'All', range: 12, level: 'company', empId: null },
  user: { username: null, role: 'VIEWER', name: 'Guest viewer', empId: null, dept: null },
  dash: 'exec',
  lastSync: null,
  audit: [],
  insightsSeen: false
};

/* ------------------------------------------------------------ audit log */
function audit(action, detail) {
  State.audit.unshift({ ts: new Date(), action, detail: detail || '', user: State.user.name, role: State.user.role });
  if (State.audit.length > 400) State.audit.pop();
}

/* ------------------------------------------------------- access control */
const Access = {
  can(dashId) {
    const d = DASH[dashId]; if (!d) return false;
    const role = State.user.role;
    if (role === 'SUPER_ADMIN') return true;
    if (!d.roles.includes(role)) return false;
    return true;
  },
  /* department heads and managers only see their own scope */
  deptScope() {
    const r = State.user.role;
    if (r === 'DEPT_HEAD' || r === 'MANAGER') return State.user.dept;
    if (r === 'EMPLOYEE') return State.user.dept;
    return null;
  },
  canSeeSalary(empId) {
    const r = State.user.role;
    if (r === 'SUPER_ADMIN' || r === 'HR_ADMIN' || r === 'FINANCE_ADMIN') return true;
    if (r === 'EMPLOYEE') return empId === State.user.empId;
    if (r === 'DEPT_HEAD' || r === 'MANAGER') {
      const e = DB.byId[empId]; return !!e && e.dept === State.user.dept;
    }
    return false; /* viewer sees aggregate only */
  },
  canSeeEmployee(empId) {
    const r = State.user.role, e = DB.byId[empId];
    if (!e) return false;
    if (r === 'SUPER_ADMIN' || r === 'HR_ADMIN' || r === 'VIEWER') return true;
    if (r === 'FINANCE_ADMIN') return true;
    if (r === 'EMPLOYEE') return empId === State.user.empId;
    if (r === 'DEPT_HEAD') return e.dept === State.user.dept;
    if (r === 'MANAGER') return e.managerId === State.user.empId || empId === State.user.empId;
    return false;
  },
  visibleEmployees() {
    const r = State.user.role;
    if (r === 'EMPLOYEE') return DB.employees.filter(e => e.id === State.user.empId);
    if (r === 'MANAGER') return DB.employees.filter(e => e.managerId === State.user.empId || e.id === State.user.empId);
    if (r === 'DEPT_HEAD') return DB.employees.filter(e => e.dept === State.user.dept);
    return DB.employees;
  }
};

/* -------------------------------------------------------- filter context */
const Ctx = {
  months() { return DB.months.slice(Math.max(0, 12 - State.filters.range)); },
  mIdx() { return new Set(Ctx.months().map(m => m.i)); },
  deptFilter() {
    const scope = Access.deptScope();
    if (scope) return scope;
    return State.filters.dept === 'All' ? null : State.filters.dept;
  },
  employees(includeExited) {
    const d = Ctx.deptFilter(), s = State.filters.site;
    return Access.visibleEmployees().filter(e =>
      (includeExited || e.status === 'Active') &&
      (!d || e.dept === d) && (s === 'All' || e.site === s));
  },
  empIds(includeExited) { return new Set(Ctx.employees(includeExited).map(e => e.id)); },
  rows(arr, key) {
    const mi = Ctx.mIdx(), ids = Ctx.empIds(true), d = Ctx.deptFilter();
    return arr.filter(x =>
      (x.mi == null || mi.has(x.mi)) &&
      (x.empId == null || ids.has(x.empId)) &&
      (!d || x.dept == null || x.dept === d));
  },
  monthsRows(arr) { const mi = Ctx.mIdx(); return arr.filter(x => mi.has(x.mi)); },
  /* share of company headcount currently in scope — used to scale
     company-level financials down to a department view                    */
  scopeShare() {
    const all = DB.employees.filter(e => e.status === 'Active').length || 1;
    return clamp(Ctx.employees().length / all, 0.02, 1);
  },
  label() {
    const d = Ctx.deptFilter(), s = State.filters.site;
    const bits = [d || 'All departments', s === 'All' ? 'All sites' : s, `last ${State.filters.range} months`];
    return bits.join(' · ');
  }
};

        .map(([k, a, b]) => ({ k, v: perfLatest.filter(p => p.rating >= a && p.rating < b).length })),

      trainingByDept: Object.entries(groupBy(tr, t => t.dept)).map(([k, v]) => ({ k, v: sum(v, t => t.hours) })).sort(byDesc('v')),
      exitReasons: Object.entries(groupBy(exits, e => e.reason)).map(([k, v]) => ({ k, v: v.length })).sort(byDesc('v')),

      attritionByTenure: [['<1 yr', e => e.tenure < 1], ['1–3 yrs', e => e.tenure >= 1 && e.tenure < 3], ['3+ yrs', e => e.tenure >= 3]].map(([k, f]) => ({ k, v: exits.filter(f).length })),
      attritionMonthly: Ctx.months().map(m => ({ key: m.key, v: exits.filter(e => e.mi === m.i).length, j: joiners.filter(j => j.mi === m.i).length })),

      byDept: Object.entries(groupBy(rows, r => r.dept)).map(([k, v]) => ({ k, v: sum(v, r => r.joined), open: v.filter(r => r.status !== 'Closed').length })).sort(byDesc('v')),

      ebitda: profit + Math.round(revenue * .03),
      target: scale(sum(rows, f => f.target)),

      cash: rows.length ? rows[rows.length - 1].cash : 0,
